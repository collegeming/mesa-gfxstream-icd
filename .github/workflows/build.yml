name: build-gfxstream-icd

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: Mesa git ref/commit to build
        required: false
        default: ec586407f5b11a7c200e52beb7fe0fe8eb17a376
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git ca-certificates ninja-build pkg-config \
            python3-pip python3-mako python3-yaml python3-packaging python3-setuptools \
            bison flex zlib1g-dev libdrm-dev libzstd-dev libexpat1-dev
          python3 -m pip install --user --break-system-packages 'meson>=1.5'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version

      - name: Fetch Mesa
        env:
          REF: ${{ github.event.inputs.mesa_ref || 'ec586407f5b11a7c200e52beb7fe0fe8eb17a376' }}
        run: |
          curl -fL --retry 3 -o mesa.tar.gz "https://gitlab.freedesktop.org/mesa/mesa/-/archive/${REF}/mesa-${REF}.tar.gz"
          mkdir -p mesa
          tar xf mesa.tar.gz -C mesa --strip-components=1
          echo "Mesa ref: $REF"
          ls mesa | head

      - name: Configure Mesa (Vulkan gfxstream ICD only)
        run: |
          cd mesa
          meson setup build --buildtype=release -Dwerror=false \
            -Dvulkan-drivers=gfxstream \
            -Dgallium-drivers= \
            -Dplatforms= \
            -Dopengl=false \
            -Dgbm=disabled -Dglx=disabled -Degl=disabled \
            -Dllvm=disabled -Dvalgrind=disabled -Dlibunwind=disabled

      - name: Build ICD
        run: |
          cd mesa
          ninja -C build src/gfxstream/libvulkan_gfxstream.so

      - name: Package
        run: |
          mkdir -p out
          cp mesa/build/src/gfxstream/libvulkan_gfxstream.so out/
          strip --strip-unneeded out/libvulkan_gfxstream.so || true
          ls -l out
          file out/libvulkan_gfxstream.so || true

      - uses: actions/upload-artifact@v4
        with:
          name: libvulkan_gfxstream-${{ github.run_number }}
          path: out/libvulkan_gfxstream.so
          if-no-files-found: error
