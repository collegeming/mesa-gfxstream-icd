name: build-gfxstream-icd

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: Mesa git ref/commit to build
        required: false
        default: ec586407f5b11a7c200e52beb7fe0fe8eb17a376
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git ca-certificates ninja-build pkg-config \
            python3-pip python3-mako python3-yaml python3-packaging python3-setuptools \
            bison flex zlib1g-dev libdrm-dev libzstd-dev libexpat1-dev
          python3 -m pip install --user --break-system-packages 'meson>=1.5'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version

      - name: Fetch Mesa
        env:
          REF: ${{ github.event.inputs.mesa_ref || 'ec586407f5b11a7c200e52beb7fe0fe8eb17a376' }}
        run: |
          curl -fL --retry 3 -o mesa.tar.gz "https://gitlab.freedesktop.org/mesa/mesa/-/archive/${REF}/mesa-${REF}.tar.gz"
          mkdir -p mesa
          tar xf mesa.tar.gz -C mesa --strip-components=1
          echo "Mesa ref: $REF"
          ls mesa | head

      - name: Configure Mesa (Vulkan gfxstream ICD only)
        run: |
          cd mesa
          meson setup build --buildtype=debugoptimized -Dwerror=false \
            -Dvulkan-drivers=gfxstream \
            -Dgallium-drivers= \
            -Dplatforms= \
            -Dopengl=false \
            -Dgbm=disabled -Dglx=disabled -Degl=disabled \
            -Dllvm=disabled -Dvalgrind=disabled -Dlibunwind=disabled

      - name: Build ICD
        run: |
          cd mesa
          ninja -C build -t targets all | grep -i gfxstream | head -20 || true
          ninja -C build
          find build -name 'libvulkan_gfxstream*' -o -name 'gfxstream_vk_icd*' | head -20

      - name: Build backtrace helper
        run: |
          mkdir -p out
          cat > bt.c <<'EOF'
          #define _GNU_SOURCE
          #include <signal.h>
          #include <execinfo.h>
          #include <unistd.h>
          #include <string.h>

          static void handler(int sig) {
              void *bt[64];
              char msg[] = "
=== BACKTRACE ===
";
              int n = backtrace(bt, 64);
              write(2, msg, sizeof(msg) - 1);
              backtrace_symbols_fd(bt, n, 2);
              signal(sig, SIG_DFL);
              raise(sig);
          }

          __attribute__((constructor)) static void bt_init(void) {
              struct sigaction sa;
              memset(&sa, 0, sizeof(sa));
              sa.sa_handler = handler;
              sa.sa_flags = SA_NODEFER;
              sigaction(SIGSEGV, &sa, 0);
              sigaction(SIGABRT, &sa, 0);
              sigaction(SIGBUS, &sa, 0);
          }
          EOF
          gcc -shared -fPIC -O1 -g -o out/libbt.so bt.c
          ls -l out

      - name: Package
        run: |
          mkdir -p out
          SO=$(find mesa/build -name 'libvulkan_gfxstream.so*' -type f | head -1)
          echo "picked: $SO"
          test -n "$SO"
          cp "$SO" out/libvulkan_gfxstream.so
          ls -l out
          file out/libvulkan_gfxstream.so || true

      - uses: actions/upload-artifact@v4
        with:
          name: libvulkan_gfxstream-${{ github.run_number }}
          path: |
            out/libvulkan_gfxstream.so
            out/libbt.so
          if-no-files-found: error
