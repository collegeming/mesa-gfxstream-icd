name: build-guest-native-map-smoke

on:
  push:
    branches: [diagnostic/guest-native-map-smoke]
    paths:
      - 'diagnostic/guest_native_map_smoke.c'
      - 'diagnostic/check_guest_native_map.py'
      - '.github/workflows/build-guest-native-map-smoke.yml'

permissions:
  contents: read

jobs:
  native-aarch64-glibc-compile-only:
    if: github.ref == 'refs/heads/diagnostic/guest-native-map-smoke'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils file libvulkan-dev python3
      - name: CPU source and negative structural checks only
        run: |
          set -euo pipefail
          mkdir out
          python3 -I diagnostic/check_guest_native_map.py diagnostic/guest_native_map_smoke.c | tee out/source-safety.txt
      - name: Native compile and ELF inspection (never execute probe)
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 -g -fPIE -pie -fno-omit-frame-pointer \
            -fstack-protector-strong -D_FORTIFY_SOURCE=2 -Wl,-z,relro,-z,now \
            -DPROBE_REVISION=\""$GITHUB_SHA"\" diagnostic/guest_native_map_smoke.c \
            -o out/guest_native_map_smoke -lvulkan 2>&1 | tee out/compiler.log
          file out/guest_native_map_smoke | tee out/binary-info.txt
          readelf -h -l -d -V -n out/guest_native_map_smoke | tee out/elf-info.txt
          nm -u out/guest_native_map_smoke | tee out/undefined-symbols.txt
          python3 -I diagnostic/check_guest_native_map.py diagnostic/guest_native_map_smoke.c \
            out/undefined-symbols.txt out/elf-info.txt | tee out/symbol-safety.txt
      - name: Package source workflow version provenance and checksums
        run: |
          set -euo pipefail
          {
            printf 'probe=guest-native-map-smoke-v1\nrepository=%s\ncommit=%s\nref=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF"
            printf 'run=%s/%s/actions/runs/%s\nattempt=%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'baseCommit=9b6b559b7c9d065f41c663093a83ea9b9fe219c9\nrunner=ubuntu-24.04-arm\n'
            uname -a
            gcc --version
            ldd --version
            dpkg-query -W libc6 libvulkan-dev libvulkan1
            printf 'compile=gcc -std=c11 -Wall -Wextra -Werror -O2 -g -fPIE -pie -fno-omit-frame-pointer -fstack-protector-strong -D_FORTIFY_SOURCE=2 -Wl,-z,relro,-z,now -DPROBE_REVISION=commit -lvulkan\n'
            printf 'execution=NEVER executed native probe; CPU structural tests only; no Vulkan init in Actions\n'
            printf 'boundary=ordinary allocation4096 type8 actual guest HOST_VISIBLE|HOST_COHERENT; one map; pointer metadata only; unmap/free/destroy\n'
            printf 'limits=driver-internal activity possible; internal blob may be larger; no payload access/coherence/backing/renderer achievement\n'
            printf 'review=parent source safety review required before device; CLI flag is NOT GPU user consent\n'
            printf 'selection=VK_DRIVER_FILES=/opt/droidvm-mesa-reference/icd.json; LD_LIBRARY_PATH first entry=/opt/droidvm-mesa-reference/usr/local/lib/aarch64-linux-gnu; metadata selectors do not prove library identity\n'
            printf 'pair-status=host owner tests green; actual paired Android binary and guest runtime validation pending\n'
          } | tee out/build-provenance.txt
          cp diagnostic/guest_native_map_smoke.c diagnostic/check_guest_native_map.py .github/workflows/build-guest-native-map-smoke.yml out/
          (cd out && sha256sum guest_native_map_smoke guest_native_map_smoke.c check_guest_native_map.py \
            build-guest-native-map-smoke.yml compiler.log binary-info.txt elf-info.txt undefined-symbols.txt \
            source-safety.txt symbol-safety.txt build-provenance.txt > SHA256SUMS)
          tar -czf guest-native-map-smoke-aarch64-glibc.tar.gz -C out .
          sha256sum guest-native-map-smoke-aarch64-glibc.tar.gz | tee guest-native-map-smoke-aarch64-glibc.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: guest-native-map-smoke-aarch64-glibc
          path: |
            guest-native-map-smoke-aarch64-glibc.tar.gz
            guest-native-map-smoke-aarch64-glibc.tar.gz.sha256
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
