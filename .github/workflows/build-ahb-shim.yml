name: build-ahb-shim

# Builds scripts/ahb_shim.c as an arm64-v8a LD_PRELOAD shim that intercepts
# AHardwareBuffer_acquire/release.  A NULL acquire or release is logged with the
# caller module+offset plus up to AHB_SHIM_FRAMES backtrace frames (the first 8
# NULL events per process), then returns instead of faulting in
# RefBase::incStrong/decStrong.  Diagnostic only; no gfxstream sources are
# involved.

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostic/ahb-acquire-shim

permissions:
  contents: read

jobs:
  build-ahb-shim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout mesa-gfxstream-icd
        uses: actions/checkout@v4

      - name: Fetch Android NDK r27c
        run: |
          set -euo pipefail
          curl -sSL --retry 3 -o "$RUNNER_TEMP/ndk.zip" \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$HOME"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r27c" >> "$GITHUB_ENV"
          echo "NDK_BIN=$HOME/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"

      - name: Build libahb_shim.so (arm64-v8a, android-33)
        run: |
          set -euo pipefail
          # _Unwind_Backtrace is exported by bionic libc itself (LIBC_Q, API 30);
          # libc.so is the only provider we need.  Do not link the NDK
          # libunwind.a: it pulls malloc/stdio/pthread_rwlock imports into the
          # NULL path.
          "$NDK_BIN/aarch64-linux-android33-clang" \
            -shared -fPIC -O2 -Wall -Wextra -Werror \
            -fno-omit-frame-pointer -funwind-tables \
            scripts/ahb_shim.c -ldl -o libahb_shim.so
          ls -l libahb_shim.so
          file libahb_shim.so

      - name: Verify exported symbols and dynamic deps
        run: |
          set -euo pipefail
          echo "== nm -D --defined-only libahb_shim.so (NDK llvm-nm) =="
          "$NDK_BIN/llvm-nm" -D --defined-only libahb_shim.so | tee dynsyms.txt
          for sym in AHardwareBuffer_acquire AHardwareBuffer_release; do
            if ! grep -Eq "[[:space:]]T[[:space:]]+${sym}$" dynsyms.txt; then
              echo "::error::missing exported symbol ${sym}"
              exit 1
            fi
          done
          echo "both AHardwareBuffer_ symbols exported"
          echo "== readelf -d libahb_shim.so (NDK llvm-readelf) =="
          "$NDK_BIN/llvm-readelf" -d libahb_shim.so | tee dynsec.txt
          echo "== NEEDED =="
          grep -E 'NEEDED' dynsec.txt
          if grep -E 'NEEDED.*libnativewindow' dynsec.txt; then
            echo "::error::shim must not depend on libnativewindow"
            exit 1
          fi
          echo "no libnativewindow dependency (real symbol is resolved via dlsym)"
          echo "== imports that must not exist (NULL path is heap/lock/stdio free) =="
          "$NDK_BIN/llvm-nm" -D libahb_shim.so | tee dynsyms-all.txt
          if grep -Eq '[[:space:]](malloc|calloc|realloc|free|printf|fprintf|pthread_mutex_lock|pthread_mutex_unlock|pthread_rwlock_rdlock|pthread_rwlock_wrlock)(@|$)' dynsyms-all.txt; then
            echo "::error::shim must not import heap/stdio/lock symbols"
            exit 1
          fi
          echo "no malloc/printf/pthread imports"
          echo "== v3 backtrace support =="
          # Resolved with dlsym() in the constructor; only the name string may
          # appear.  A dynsym reference would mean libunwind.a got linked and
          # brought malloc/stdio/pthread_rwlock in.
          grep -aq '_Unwind_Backtrace' libahb_shim.so
          grep -aq '_Unwind_GetIP' libahb_shim.so
          if grep -Eq '_Unwind_(Backtrace|GetIP)' dynsyms-all.txt; then
            echo "::error::unwinder symbols must not be link-time references"
            exit 1
          fi
          grep -Eq '[[:space:]]dladdr(@|$)' dynsyms-all.txt
          # bionic exports both entries from libc.so in the LIBC_Q version
          # (API 30), which is what the android-33 target resolves against.
          # They stay undefined here and are dlsym()'d at load time.
          echo "unwinder names and dladdr present; no link-time unwinder reference"

      - name: Static checks (NULL paths never resolve or tail-call the real symbol)
        run: |
          set -euo pipefail
          "$NDK_BIN/llvm-objdump" -d --no-show-raw-insn libahb_shim.so | tee disasm.txt
          python3 scripts/ahb_shim_checks.py "$NDK_BIN/llvm-objdump" libahb_shim.so

      - name: Host unit test (x86, same source and warning flags)
        run: |
          set -euo pipefail
          mkdir -p hosttest
          cd hosttest
          cc -shared -fPIC -O2 -Wall -Wextra -Werror -DAHB_SHIM_STUB \
            -o libahb_stub.so ../scripts/ahb_shim_test.c
          cc -O2 -Wall -Wextra -Werror -o ahb_shim_test \
            ../scripts/ahb_shim_test.c -L. -lahb_stub -Wl,-rpath,'$ORIGIN'
          cc -shared -fPIC -O2 -Wall -Wextra -Werror \
            -fno-omit-frame-pointer -funwind-tables \
            -o libahb_shim_host.so ../scripts/ahb_shim.c \
            -Wl,--no-as-needed -lgcc_s

          run_case() {
            case_name="$1"
            shift
            env LD_PRELOAD="$PWD/libahb_shim_host.so" "$@" \
              ./ahb_shim_test "$case_name" 2>&1
          }
          count() {
            printf '%s\n' "$1" | grep -c "$2" || true
          }

          echo "== case: NULL release logs caller + frames, never reaches real fn =="
          out=$(run_case null-release)
          printf '%s\n' "$out"
          test "$(count "$out" 'AHB-SHIM release-null caller=0x')" -eq 1
          test "$(count "$out" '^#[0-9][0-9] pc=0x')" -ge 1
          test "$(count "$out" 'REAL release')" -eq 0
          printf '%s\n' "$out" | grep -q 'SUMMARY real-acquire=0 real-release=0'

          echo "== case: 30x NULL release = 8 full traces + 22 summary lines =="
          out=$(run_case null-release-many)
          test "$(count "$out" 'AHB-SHIM release-null caller=0x')" -eq 8
          test "$(count "$out" 'AHB-SHIM release-null suppressed=')" -eq 22
          printf '%s\n' "$out" | grep -q 'AHB-SHIM release-null suppressed=22 tid='
          test "$(count "$out" 'REAL release')" -eq 0

          echo "== case: NULL acquire logs caller + frames, not forwarded =="
          out=$(run_case null-acquire)
          printf '%s\n' "$out"
          test "$(count "$out" 'AHB-SHIM acquire-null caller=0x')" -eq 1
          test "$(count "$out" '^#[0-9][0-9] pc=0x')" -ge 1
          test "$(count "$out" 'REAL acquire')" -eq 0

          echo "== case: AHB_SHIM_FRAMES caps the frame dump =="
          out=$(run_case null-acquire AHB_SHIM_FRAMES=2)
          frames=$(count "$out" '^#[0-9][0-9] pc=0x')
          echo "frame lines with AHB_SHIM_FRAMES=2: $frames"
          test "$frames" -ge 1
          test "$frames" -le 2
          test "$(count "$out" 'AHB-SHIM acquire-null caller=0x')" -eq 1

          echo "== case: AHB_SHIM_FRAMES=0 keeps only the caller line =="
          out=$(run_case null-acquire AHB_SHIM_FRAMES=0)
          test "$(count "$out" 'AHB-SHIM acquire-null caller=0x')" -eq 1
          test "$(count "$out" '^#[0-9][0-9] pc=0x')" -eq 0

          echo "== case: 30x NULL acquire = 8 full traces + 22 summary lines =="
          out=$(run_case null-acquire-many)
          test "$(count "$out" 'AHB-SHIM acquire-null caller=0x')" -eq 8
          test "$(count "$out" 'AHB-SHIM acquire-null suppressed=')" -eq 22
          printf '%s\n' "$out" | grep -q 'AHB-SHIM acquire-null suppressed=22 tid='
          test "$(count "$out" 'REAL acquire')" -eq 0

          echo "== case: AHB_SHIM_LOG receives the same multi-line block =="
          log="$PWD/ahb_shim_test.log"
          rm -f "$log"
          out=$(run_case null-acquire AHB_SHIM_LOG="$log")
          test "$(count "$out" 'AHB-SHIM acquire-null caller=0x')" -eq 0
          logged=$(cat "$log")
          test "$(count "$logged" 'AHB-SHIM acquire-null caller=0x')" -eq 1
          test "$(count "$logged" '^#[0-9][0-9] pc=0x')" -ge 1
          test "$(count "$logged" 'shim=v3')" -eq 1

          echo "== case: non-NULL adds no log by default (banner only) =="
          out=$(run_case non-null)
          printf '%s\n' "$out"
          test "$(count "$out" '^AHB-SHIM ')" -eq 1
          test "$(count "$out" 'acquire-null\|release-null')" -eq 0
          printf '%s\n' "$out" | grep -q 'SUMMARY real-acquire=1 real-release=1'

          echo "== case: release tracing stays opt-in =="
          out=$(run_case non-null AHB_SHIM_TRACE_RELEASE=1)
          test "$(count "$out" 'AHB-SHIM release ptr=')" -eq 1
          echo "host unit tests PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: ahb-shim-arm64
          path: libahb_shim.so
          if-no-files-found: error
          retention-days: 30
