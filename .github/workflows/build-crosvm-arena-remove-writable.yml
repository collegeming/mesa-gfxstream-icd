name: build-crosvm-arena-remove-writable
# Candidate-only build. Nothing here deploys to a device.
#
# Patch under test: MemoryMappingArena::remove() fills a removed sub-range with an anonymous
# PRIVATE READ-WRITE mapping instead of PROT_READ. The virtio-gpu shared-memory BAR is one KVM
# memslot, so a read-only fill makes a guest write take a stage-2 permission fault that arm64 KVM
# resolves as -EFAULT from KVM_RUN (kvm_s2_fault_pin_pfn -> __kvm_faultin_pfn ->
# KVM_PFN_ERR_RO_FAULT); crosvm's vCPU loop then exits the VM with
# "vcpu hit unknown error: Bad address (os error 14)".
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Resolve lock, dry preflight, or explicitly build NEW fixed baseline; never deploys'
        type: choice
        options: [resolve, preflight, bootstrap-check, metadata-preflight, fixed-baseline, fixed-metadata, legacy-build]
        default: resolve
        required: true
      fix_fourcc:
        description: 'With fixed-metadata: also apply the reviewed zero-fourcc fallback fix'
        type: boolean
        default: false
        required: false
      fix_bridge_saved_frame:
        description: 'With fixed-metadata: also apply the reviewed bridge saved-frame auto redraw fix (packages/modules/Virtualization)'
        type: boolean
        default: false
        required: false
      fix_bridge_saved_frame_v2:
        description: 'With fixed-metadata: apply the v2 deferred-retry bridge saved-frame redraw (supersedes the v1 inline draw; mutually exclusive with fix_bridge_saved_frame)'
        type: boolean
        default: false
        required: false
      fix_kbase_evt:
        description: 'Also build the host-side libvirglrenderer (Mali kbase renderer) with the group-error decode + shadow-BO live-mapping patches in this same run; never deploys'
        type: boolean
        default: false
        required: false
  push:
    branches: [fix/crosvm-arena-remove-writable]
    paths:
      - '.github/workflows/build-crosvm-arena-remove-writable.yml'
      - 'scripts/patch_crosvm_arena_remove_writable.py'
permissions:
  contents: read
concurrency:
  group: ${{ inputs.phase == 'metadata-preflight' && 'crosvm-metadata-preflight' || inputs.phase == 'fixed-metadata' && 'crosvm-fixed-metadata' || 'crosvm-arena-remove-writable' }}
  cancel-in-progress: false
jobs:
  metadata-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'metadata-preflight' && github.ref == 'refs/heads/diagnostic/scanout-contract-pinned-recipe'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: patch-repo
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: collegeming/crosvm
          ref: 849e05f12d5c8d4c36af8e15763986d242cd43b5
          path: source
          persist-credentials: false
      - name: Metadata recipe check/apply only; no compiler or runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = 849e05f12d5c8d4c36af8e15763986d242cd43b5
          test -z "$(git -C source status --porcelain)"
          mkdir metadata-evidence
          python3 -I patch-repo/scripts/patch_crosvm_scanout_contract.py source --check | tee metadata-evidence/check.txt
          test -z "$(git -C source status --porcelain)"
          python3 -I patch-repo/scripts/patch_crosvm_scanout_contract.py source | tee metadata-evidence/apply.txt
          diff -u <(grep -E '^[0-9a-f]{64}  ' metadata-evidence/check.txt) <(grep -E '^[0-9a-f]{64}  ' metadata-evidence/apply.txt)
          git -C source diff --check
          git -C source diff --name-only | sort > metadata-evidence/affected-files.txt
          printf '%s\n' devices/src/virtio/gpu/virtio_gpu.rs gpu_display/src/gpu_display_android.rs gpu_display/src/lib.rs | sort > metadata-evidence/expected-files.txt
          diff -u metadata-evidence/expected-files.txt metadata-evidence/affected-files.txt
          git -C source diff --binary > metadata-evidence/source.patch
          sha256sum patch-repo/scripts/patch_crosvm_scanout_contract.py > metadata-evidence/helper-SHA256SUMS
          (cd metadata-evidence && sha256sum source.patch check.txt apply.txt affected-files.txt > SHA256SUMS && sha256sum -c SHA256SUMS)
          echo 'METADATA_PREFLIGHT_PASS: exact blobs, preserved operation counts, check/apply SHA and exactly 3 files; NOT_COMPILED NOT_DEVICE_TESTED'
      - uses: actions/upload-artifact@v4
        with:
          name: crosvm-metadata-preflight-${{ github.run_id }}
          path: metadata-evidence/
          if-no-files-found: error
  resolve-manifest:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'resolve'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed resolver only
        uses: actions/checkout@v4
        with:
          path: patch-repo
          persist-credentials: false
      - name: Resolver selfcheck (CI only, no build)
        run: python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/lock_crosvm_manifest.py" --selfcheck
      - name: Checkout exact input manifest (not deployed-run reconstruction)
        uses: actions/checkout@v4
        with:
          repository: Droid-VM/crosvm-minimal-manifest
          ref: 6ee0c357c461f09245a0378c55459993f067876e
          path: manifest-source
          persist-credentials: false
      - name: Resolve every project and supplemental llvm-libc to full SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/manifest-source" rev-parse HEAD)" = 6ee0c357c461f09245a0378c55459993f067876e
          test ! -e "$GITHUB_WORKSPACE/manifest-lock"
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/lock_crosvm_manifest.py" \
            --manifest "$GITHUB_WORKSPACE/manifest-source/crosvm-minimal.xml" \
            --output "$GITHUB_WORKSPACE/manifest-lock"
          {
            echo 'NEW_FIXED_BASELINE_NOT_DEPLOYED_REPRODUCTION'
            echo 'Historical run43938110284 did not publish a complete resolved manifest.'
            echo 'NOT_BUILT; NOT_DEVICE_TESTED; no source sync or compile performed.'
            git -C "$GITHUB_WORKSPACE/patch-repo" rev-parse HEAD
            git --version
            python3 --version
            sha256sum "$GITHUB_WORKSPACE/patch-repo/scripts/lock_crosvm_manifest.py"
          } > "$GITHUB_WORKSPACE/manifest-lock/BUILD-INFO.txt"
          cd "$GITHUB_WORKSPACE/manifest-lock"
          sha256sum input-manifest.xml resolved-manifest.xml lock-info.json BUILD-INFO.txt > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Upload lock for independent review (never auto-build)
        uses: actions/upload-artifact@v4
        with:
          name: crosvm-new-fixed-manifest-${{ github.run_id }}
          path: manifest-lock/
          if-no-files-found: error
  fixed-preflight:
    if: github.event_name == 'workflow_dispatch' && (inputs.phase == 'preflight' || inputs.phase == 'fixed-baseline' || inputs.phase == 'fixed-metadata')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: patch-repo
          persist-credentials: false
      - name: Verify locked inputs and run dry metadata admission selfcheck
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/patch-repo/manifests/new-fixed-44129434140"
          sha256sum -c SHA256SUMS
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/check_crosvm_fixed_build.py" --lock "$PWD" --selfcheck
  bootstrap-check:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'bootstrap-check' && github.ref == 'refs/heads/diagnostic/scanout-contract-pinned-recipe'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: patch-repo
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: GerritCodeReview/git-repo
          ref: 97dc5c1bd9527c2abe2183b16a4b7ef037dc34a7
          path: repo-tool
          persist-credentials: false
      - name: Shared exact bootstrap only (signature verification enabled; no project sync)
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$GITHUB_WORKSPACE/aosp"
          bash "$GITHUB_WORKSPACE/patch-repo/scripts/init_crosvm_fixed_repo.sh" "$GITHUB_WORKSPACE"
          test ! -e "$GITHUB_WORKSPACE/aosp/external/crosvm"
          echo 'BOOTSTRAP_CHECK_PASS: exact tag, peeled SHA, repo signature verification and HEAD; no project sync/build/device'
  fixed-baseline:
    name: fixed-${{ inputs.phase == 'fixed-metadata' && (inputs.fix_fourcc && 'metadata-fix' || 'metadata') || 'baseline' }}
    if: github.event_name == 'workflow_dispatch' && (inputs.phase == 'fixed-baseline' || inputs.phase == 'fixed-metadata') && github.ref == 'refs/heads/diagnostic/scanout-contract-pinned-recipe'
    needs: fixed-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_VARIANT: ${{ inputs.phase == 'fixed-metadata' && (inputs.fix_fourcc && 'metadata-fix' || 'metadata') || 'baseline' }}
      FIX_FOURCC_INPUT: ${{ inputs.fix_fourcc }}
      FIX_BRIDGE_SAVED_FRAME_INPUT: ${{ inputs.fix_bridge_saved_frame }}
      FIX_BRIDGE_SAVED_FRAME_V2_INPUT: ${{ inputs.fix_bridge_saved_frame_v2 }}
      FIX_KBASE_EVT_INPUT: ${{ inputs.fix_kbase_evt }}
      CARGO_BUILD_JOBS: '2'
      LOCK: ${{ github.workspace }}/patch-repo/manifests/new-fixed-44129434140
      EVIDENCE: ${{ github.workspace }}/fixed-evidence
      EXACT_OUTPUT: out/soong/.intermediates/external/crosvm/crosvm_device_only/crosvm_device_only_bin/android_arm64_armv8-a/unstripped/crosvm
    steps:
      - uses: actions/checkout@v4
        with:
          path: patch-repo
          persist-credentials: false
      - name: Checkout exact historical compatibility helpers (not current HEAD helpers)
        uses: actions/checkout@v4
        with:
          ref: 3c20ef7b333755e488f92946249ae92660385f35
          path: compat-repo
          persist-credentials: false
      - name: Checkout pinned repo launcher
        uses: actions/checkout@v4
        with:
          repository: GerritCodeReview/git-repo
          ref: 97dc5c1bd9527c2abe2183b16a4b7ef037dc34a7
          path: repo-tool
          persist-credentials: false
      - name: Prepare isolated runner and evidence (no device access)
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$GITHUB_WORKSPACE/aosp"
          mkdir "$EVIDENCE" "$GITHUB_WORKSPACE/aosp"
          cp "$LOCK/"* "$EVIDENCE/"
          (cd "$LOCK" && sha256sum -c SHA256SUMS)
          test "$(git -C "$GITHUB_WORKSPACE/compat-repo" rev-parse HEAD)" = 3c20ef7b333755e488f92946249ae92660385f35
          test "$(git -C "$GITHUB_WORKSPACE/repo-tool" rev-parse HEAD)" = 97dc5c1bd9527c2abe2183b16a4b7ef037dc34a7
          sha256sum "$GITHUB_WORKSPACE/compat-repo/scripts/"{patch_crosvm_arena_remove_writable,fix_gfxstream_gettid,provide_missing_include_bytes,disable_crosvm_host_variant}.py > "$EVIDENCE/compat-helper-SHA256SUMS"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/lib/jvm /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell
          sudo apt-get clean
          sudo docker image prune -a -f
          sudo fallocate -l 8G /swapfile-fixed
          sudo chmod 600 /swapfile-fixed
          sudo mkswap /swapfile-fixed
          sudo swapon /swapfile-fixed
      - name: Sync ONLY full-SHA manifest then verify every pristine project HEAD
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/patch-repo/scripts/init_crosvm_fixed_repo.sh" "$GITHUB_WORKSPACE"
          sha256sum "$GITHUB_WORKSPACE/patch-repo/scripts/init_crosvm_fixed_repo.sh" > "$EVIDENCE/bootstrap-helper-SHA256SUMS"
          cd "$GITHUB_WORKSPACE/aosp"
          python3 -I "$GITHUB_WORKSPACE/repo-tool/repo" sync -c -j8 --no-tags --optimized-fetch
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/check_crosvm_fixed_build.py" \
            --lock "$LOCK" --tree "$PWD" --evidence "$EVIDENCE/verified-project-heads.json"
          python3 -I "$GITHUB_WORKSPACE/repo-tool/repo" manifest -r -o "$EVIDENCE/synced-resolved-manifest.xml"
      - name: Apply historical paired arena and Android build compatibility only
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/aosp"
          H="$GITHUB_WORKSPACE/compat-repo/scripts"
          python3 -I "$H/fix_gfxstream_gettid.py" .
          python3 -I "$H/provide_missing_include_bytes.py" external/crosvm | tee "$EVIDENCE/include-bytes-placeholders.txt"
          python3 -I "$H/patch_crosvm_arena_remove_writable.py" external/crosvm
          python3 -I "$H/patch_crosvm_arena_remove_writable.py" external/crosvm --check
          python3 -I "$H/disable_crosvm_host_variant.py" external/crosvm
          git -C external/crosvm diff --check
          git -C hardware/google/gfxstream diff --check
          git -C external/crosvm diff --binary > "$EVIDENCE/source.patch"
          git -C hardware/google/gfxstream diff --binary > "$EVIDENCE/gfxstream-gettid.patch"
          sha256sum "$EVIDENCE/source.patch" "$EVIDENCE/gfxstream-gettid.patch" > "$EVIDENCE/patch-SHA256SUMS"
      - name: Metadata variant only; exact reviewed additive patch before SAME build
        if: inputs.phase == 'fixed-metadata'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/aosp"
          cp "$EVIDENCE/source.patch" "$EVIDENCE/baseline-source.patch"
          printf '%s  %s\n' 18990c89e7d0107d0e84c732bd88c9358a45b86689ac13f28c4694622a8dbadf "$GITHUB_WORKSPACE/patch-repo/scripts/patch_crosvm_scanout_contract.py" | sha256sum -c -
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/patch_crosvm_scanout_contract.py" external/crosvm --check | tee "$EVIDENCE/metadata-check.txt"
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/patch_crosvm_scanout_contract.py" external/crosvm | tee "$EVIDENCE/metadata-apply.txt"
          diff -u <(grep -E '^[0-9a-f]{64}  ' "$EVIDENCE/metadata-check.txt") <(grep -E '^[0-9a-f]{64}  ' "$EVIDENCE/metadata-apply.txt")
          git -C external/crosvm diff --check
          git -C external/crosvm diff --name-only -- devices/src/virtio/gpu/virtio_gpu.rs gpu_display/src/lib.rs gpu_display/src/gpu_display_android.rs | sort > "$EVIDENCE/metadata-affected-files.txt"
          printf '%s\n' devices/src/virtio/gpu/virtio_gpu.rs gpu_display/src/gpu_display_android.rs gpu_display/src/lib.rs | sort > "$EVIDENCE/metadata-expected-files.txt"
          diff -u "$EVIDENCE/metadata-expected-files.txt" "$EVIDENCE/metadata-affected-files.txt"
          git -C external/crosvm diff --binary -- devices/src/virtio/gpu/virtio_gpu.rs gpu_display/src/lib.rs gpu_display/src/gpu_display_android.rs > "$EVIDENCE/metadata-only.patch"
          printf '%s  %s\n' baa83edbe6f024e67b77a5e3b71e5ed109041ef1c27dd01eb149740088fc3916 "$EVIDENCE/metadata-only.patch" | sha256sum -c -
          git -C external/crosvm diff --binary > "$EVIDENCE/source.patch"
          sha256sum "$EVIDENCE/source.patch" "$EVIDENCE/gfxstream-gettid.patch" "$EVIDENCE/metadata-only.patch" "$EVIDENCE/baseline-source.patch" > "$EVIDENCE/patch-SHA256SUMS"
          sha256sum "$GITHUB_WORKSPACE/patch-repo/scripts/patch_crosvm_scanout_contract.py" > "$EVIDENCE/metadata-helper-SHA256SUMS"
          printf '%s\n' 'DIAGNOSTIC_ONLY; coverage=transfer_read_direct,transfer_read_staging; NOT import/pool/mmap' 'query_status=cached_info_3d_NOT_live_export; resource_format=creation_enum_or_unknown_blob_restore' 'raw ANB metadata only; no pixel/fourcc/alpha behavior change; global events<=16; NOT_DEVICE_TESTED' > "$EVIDENCE/metadata-coverage.txt"
      - name: Optional single-variable fix; zero fourcc falls back to scanout format
        if: inputs.phase == 'fixed-metadata' && inputs.fix_fourcc
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/aosp"
          printf '%s  %s\n' 98537085dedc01d20bd06f11c74f4b3872441b72d6e4ee56cc61e5c2bffdb49c "$GITHUB_WORKSPACE/patch-repo/scripts/patch_crosvm_fourcc_zero_fallback.py" | sha256sum -c -
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/patch_crosvm_fourcc_zero_fallback.py" external/crosvm --check | tee "$EVIDENCE/fix-fourcc-check.txt"
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/patch_crosvm_fourcc_zero_fallback.py" external/crosvm | tee "$EVIDENCE/fix-fourcc-apply.txt"
          diff -u <(grep -E '^[0-9a-f]{64}  ' "$EVIDENCE/fix-fourcc-check.txt") <(grep -E '^[0-9a-f]{64}  ' "$EVIDENCE/fix-fourcc-apply.txt")
          git -C external/crosvm diff --check
          git -C external/crosvm diff --binary -- devices/src/virtio/gpu/virtio_gpu.rs > "$EVIDENCE/fix-fourcc.patch"
          test -s "$EVIDENCE/fix-fourcc.patch"
          git -C external/crosvm diff --binary > "$EVIDENCE/source.patch"
          printf '%s\n' 'BEHAVIOR_CHANGE=single_variable: cached query fourcc==0 is treated as no answer and falls back to the existing scanout_data fourcc' 'unchanged: sink_fourcc/alpha/transfer path/renderer calls; metadata logs retained' 'NOT_DEVICE_TESTED' > "$EVIDENCE/fix-fourcc-coverage.txt"
      - name: Optional single-variable fix; bridge redraws the saved frame on reconnect
        if: inputs.phase == 'fixed-metadata' && inputs.fix_bridge_saved_frame
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/aosp"
          printf '%s  %s\n' 8a860197386cd66b64434c6fc97325607b7c76341f11d496ee061ebdf237cb99 "$GITHUB_WORKSPACE/patch-repo/scripts/patch_crosvm_bridge_saved_frame_autodraw.py" | sha256sum -c -
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/patch_crosvm_bridge_saved_frame_autodraw.py" packages/modules/Virtualization --check | tee "$EVIDENCE/fix-bridge-check.txt"
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/patch_crosvm_bridge_saved_frame_autodraw.py" packages/modules/Virtualization | tee "$EVIDENCE/fix-bridge-apply.txt"
          diff -u <(grep -E '^[0-9a-f]{64}  ' "$EVIDENCE/fix-bridge-check.txt") <(grep -E '^[0-9a-f]{64}  ' "$EVIDENCE/fix-bridge-apply.txt")
          git -C packages/modules/Virtualization diff --check
          git -C packages/modules/Virtualization diff --binary -- libs/android_display_backend/crosvm_android_display_client.cpp > "$EVIDENCE/fix-bridge-saved-frame.patch"
          test -s "$EVIDENCE/fix-bridge-saved-frame.patch"
          printf '%s\n' 'BEHAVIOR_CHANGE=single_variable: removeSurface saves the last presented frame inline (same copy saveFrame performs) and setNativeSurface redraws the saved frame right after attach' 'unchanged: AIDL saveFrameForSurface/drawSavedFrameForSurface still work and stay idempotent; no new buffer/format/fence/geometry logic; save failure is logged and removal continues; draw failure is logged and attach still succeeds' 'patched repo: packages/modules/Virtualization @ 862c6af544ce4ca89e5dc8f1aca10a832367d77f; source.patch covers external/crosvm only, the bridge diff is this patch file' 'NOT_DEVICE_TESTED' > "$EVIDENCE/fix-bridge-coverage.txt"
      - name: Optional single-variable fix; v2 bridge redraws the saved frame after a deferred retry
        if: inputs.phase == 'fixed-metadata' && inputs.fix_bridge_saved_frame_v2
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.fix_bridge_saved_frame }}" = "true" ]; then
            echo 'fix_bridge_saved_frame (v1) and fix_bridge_saved_frame_v2 transform the same file from the same pinned tree; dispatch v2 alone' >&2
            exit 1
          fi
          cd "$GITHUB_WORKSPACE/aosp"
          printf '%s  %s\n' 898001f1119a6d04c930e69c0e94241590ff50ef08aaf0726a8873e9f30505b8 "$GITHUB_WORKSPACE/patch-repo/scripts/patch_crosvm_bridge_saved_frame_v2.py" | sha256sum -c -
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/patch_crosvm_bridge_saved_frame_v2.py" packages/modules/Virtualization --check | tee "$EVIDENCE/fix-bridge-v2-check.txt"
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/patch_crosvm_bridge_saved_frame_v2.py" packages/modules/Virtualization | tee "$EVIDENCE/fix-bridge-v2-apply.txt"
          diff -u <(grep -E '^[0-9a-f]{64}  ' "$EVIDENCE/fix-bridge-v2-check.txt") <(grep -E '^[0-9a-f]{64}  ' "$EVIDENCE/fix-bridge-v2-apply.txt")
          git -C packages/modules/Virtualization diff --check
          git -C packages/modules/Virtualization diff --binary -- libs/android_display_backend/crosvm_android_display_client.cpp > "$EVIDENCE/fix-bridge-saved-frame-v2.patch"
          test -s "$EVIDENCE/fix-bridge-saved-frame-v2.patch"
          printf '%s\n' 'BEHAVIOR_CHANGE=single_variable: removeSurface keeps the round-1 inline save and records the frame geometry; setNativeSurface spawns a detached loop that waits 400ms and then redraws the saved frame with 100/300/700ms backoff, at most 4 attempts (~1.5s), instead of drawing inline in the binder call; both ANativeWindow_lock failure sites now log the native status' 'round1_regression: the inline draw raced the app-side buffer queue setup (run 44384405422: the saved frame painted on attach but every live flip then failed with "Failed to lock window")' 'unchanged: AIDL saveFrameForSurface/drawSavedFrameForSurface still work and stay idempotent; no new buffer/format/fence/geometry logic; thread spawn failure is logged and attach still succeeds; a stale-geometry draw is refused because drawSavedFrame leaks its dequeued buffer on copy mismatch' 'patched repo: packages/modules/Virtualization @ 862c6af544ce4ca89e5dc8f1aca10a832367d77f; source.patch covers external/crosvm only, the bridge diff is this patch file' 'NOT_DEVICE_TESTED' > "$EVIDENCE/fix-bridge-v2-coverage.txt"
      - name: Build current exact device-only module; any m failure stops admission
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/aosp"
          test ! -e out
          source build/envsetup.sh
          lunch aosp_arm64 trunk_staging eng
          test ! -e "$EXACT_OUTPUT"
          touch "$EVIDENCE/build-start"
          ALLOW_MISSING_DEPENDENCIES=true SOONG_ALLOW_MISSING_DEPENDENCIES=true \
            TARGET_BUILD_UNBUNDLED=true m crosvm_device_only -j2 2>&1 | tee "$EVIDENCE/soong-crosvm.log"
          test "$EXACT_OUTPUT" -nt "$EVIDENCE/build-start"
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/check_crosvm_fixed_build.py" \
            --lock "$LOCK" --tree "$PWD" --log "$EVIDENCE/soong-crosvm.log" --evidence "$EVIDENCE/output-admission.json"
          readelf -h -d "$EXACT_OUTPUT" > "$EVIDENCE/crosvm-elf.txt"
          # Graph path is printed by historical soong-crosvm.log:291. -t commands never builds.
          test -s out/soong/build.aosp_arm64.ninja
          prebuilts/build-tools/linux-x86/bin/ninja -f out/soong/build.aosp_arm64.ninja \
            -t commands "$EXACT_OUTPUT" > "$EVIDENCE/device-only-link-commands.txt"
          test -s "$EVIDENCE/device-only-link-commands.txt"
          cp "$EXACT_OUTPUT" "$EVIDENCE/crosvm"
          cp build/soong/rust/config/global.go "$EVIDENCE/rust-toolchain-config.go"
          cp build/soong/cc/config/global.go "$EVIDENCE/clang-toolchain-config.go"
          # Record toolchain identities without executing prebuilt compilers:
          # prebuilt clang.real requires libtinfo.so.5, absent on ubuntu-24.04 outside envsetup.
          for compiler in prebuilts/rust/linux-x86/*/bin/rustc prebuilts/clang/host/linux-x86/clang-*/bin/clang; do
            if [ -x "$compiler" ]; then
              printf '\n%s\n' "$compiler"
              sha256sum "$compiler"
              dir=$(dirname "$(dirname "$compiler")")
              for vf in "$dir/AndroidVersion.txt" "$dir/version.txt"; do
                if [ -f "$vf" ]; then printf '%s: ' "$vf"; cat "$vf"; fi
              done
              if [ -f "$(dirname "$compiler")/clang.real" ]; then sha256sum "$(dirname "$compiler")/clang.real"; fi
            fi
          done > "$EVIDENCE/compiler-versions.txt"
          {
            echo 'NEW_FIXED_BASELINE_NOT_DEPLOYED_REPRODUCTION'
            printf 'variant=%s\n' "$BUILD_VARIANT"
            printf 'inputs: fix_fourcc=%s fix_bridge_saved_frame=%s fix_bridge_saved_frame_v2=%s fix_kbase_evt=%s\n' "$FIX_FOURCC_INPUT" "$FIX_BRIDGE_SAVED_FRAME_INPUT" "$FIX_BRIDGE_SAVED_FRAME_V2_INPUT" "$FIX_KBASE_EVT_INPUT"
            echo 'baseline_ci_source=d290a8250a71ffa0e858737098ccbf03caf3180a; same 97-project lock and historical compatibility helpers'
            if [ "$BUILD_VARIANT" != baseline ]; then
              cat "$EVIDENCE/metadata-coverage.txt" "$EVIDENCE/metadata-helper-SHA256SUMS"
              sha256sum "$EVIDENCE/metadata-only.patch" "$EVIDENCE/baseline-source.patch"
              if [ -f "$EVIDENCE/fix-fourcc.patch" ]; then
                cat "$EVIDENCE/fix-fourcc-coverage.txt"
                sha256sum "$EVIDENCE/fix-fourcc.patch" "$EVIDENCE/fix-fourcc-check.txt" "$EVIDENCE/fix-fourcc-apply.txt"
              fi
              if [ -f "$EVIDENCE/fix-bridge-saved-frame.patch" ]; then
                cat "$EVIDENCE/fix-bridge-coverage.txt"
                sha256sum "$EVIDENCE/fix-bridge-saved-frame.patch" "$EVIDENCE/fix-bridge-check.txt" "$EVIDENCE/fix-bridge-apply.txt"
                sha256sum "$GITHUB_WORKSPACE/patch-repo/scripts/patch_crosvm_bridge_saved_frame_autodraw.py"
              fi
              if [ -f "$EVIDENCE/fix-bridge-saved-frame-v2.patch" ]; then
                cat "$EVIDENCE/fix-bridge-v2-coverage.txt"
                sha256sum "$EVIDENCE/fix-bridge-saved-frame-v2.patch" "$EVIDENCE/fix-bridge-v2-check.txt" "$EVIDENCE/fix-bridge-v2-apply.txt"
                sha256sum "$GITHUB_WORKSPACE/patch-repo/scripts/patch_crosvm_bridge_saved_frame_v2.py"
              fi
            fi
            echo 'NOT_DEVICE_TESTED; no deployment; Gunyah placeholders not exercised (KVM only)'
            printf 'exact_output=%s\n' "$EXACT_OUTPUT"
            echo 'target=aosp_arm64/trunk_staging/eng; module=crosvm_device_only; jobs=2'
            echo 'ALLOW_MISSING_DEPENDENCIES=true SOONG_ALLOW_MISSING_DEPENDENCIES=true TARGET_BUILD_UNBUNDLED=true'
            git -C "$GITHUB_WORKSPACE/patch-repo" rev-parse HEAD
            git -C "$GITHUB_WORKSPACE/compat-repo" rev-parse HEAD
            sha256sum "$LOCK/resolved-manifest.xml" "$EVIDENCE/"{source.patch,gfxstream-gettid.patch,crosvm}
            echo 'Actual module compile/link commands: device-only-link-commands.txt (ninja -t commands; no rebuild)'
            sha256sum "$EVIDENCE/device-only-link-commands.txt" "$EVIDENCE/"{rust-toolchain-config.go,clang-toolchain-config.go}
            cat "$EVIDENCE/compiler-versions.txt" "$EVIDENCE/compat-helper-SHA256SUMS" "$EVIDENCE/include-bytes-placeholders.txt"
          } > "$EVIDENCE/BUILD-INFO.txt"
          (cd "$EVIDENCE" && sha256sum crosvm source.patch gfxstream-gettid.patch resolved-manifest.xml input-manifest.xml lock-info.json synced-resolved-manifest.xml verified-project-heads.json output-admission.json compiler-versions.txt device-only-link-commands.txt rust-toolchain-config.go clang-toolchain-config.go compat-helper-SHA256SUMS patch-SHA256SUMS include-bytes-placeholders.txt soong-crosvm.log crosvm-elf.txt BUILD-INFO.txt > SHA256SUMS && sha256sum -c SHA256SUMS)
          if [ "$BUILD_VARIANT" != baseline ]; then
            (cd "$EVIDENCE" && sha256sum metadata-only.patch baseline-source.patch metadata-helper-SHA256SUMS metadata-coverage.txt metadata-check.txt metadata-apply.txt metadata-affected-files.txt >> SHA256SUMS && sha256sum -c SHA256SUMS)
          fi
          if [ "$BUILD_VARIANT" = metadata-fix ]; then
            (cd "$EVIDENCE" && sha256sum fix-fourcc.patch fix-fourcc-coverage.txt fix-fourcc-check.txt fix-fourcc-apply.txt >> SHA256SUMS && sha256sum -c SHA256SUMS)
          fi
          if [ -f "$EVIDENCE/fix-bridge-saved-frame.patch" ]; then
            (cd "$EVIDENCE" && sha256sum fix-bridge-saved-frame.patch fix-bridge-coverage.txt fix-bridge-check.txt fix-bridge-apply.txt >> SHA256SUMS && sha256sum -c SHA256SUMS)
          fi
          if [ -f "$EVIDENCE/fix-bridge-saved-frame-v2.patch" ]; then
            (cd "$EVIDENCE" && sha256sum fix-bridge-saved-frame-v2.patch fix-bridge-v2-coverage.txt fix-bridge-v2-check.txt fix-bridge-v2-apply.txt >> SHA256SUMS && sha256sum -c SHA256SUMS)
          fi
      - name: Upload successful fixed variant only
        uses: actions/upload-artifact@v4
        with:
          name: crosvm-new-fixed-${{ env.BUILD_VARIANT }}-${{ github.run_id }}
          path: fixed-evidence/
          if-no-files-found: error
      - name: Preserve failure evidence without publishing a baseline artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crosvm-fixed-${{ env.BUILD_VARIANT }}-failure-${{ github.run_id }}
          path: |
            fixed-evidence/*.log
            fixed-evidence/*manifest.xml
            fixed-evidence/*heads.json
            fixed-evidence/*.patch
            fixed-evidence/*SHA256SUMS
          if-no-files-found: warn
  # Host-side libvirglrenderer (Mali kbase renderer) with the fix_kbase_evt patches:
  # A1 decode the CS group-error notification op3 used to drop with -EIO;
  # A2 route shadow-BO copy accesses (cmd2/cmd3) through the live kbase
  # mapping instead of the stale memfd copy.  Built from the pinned panvk
  # CI commit in the same run as the fixed crosvm so the deployed pair
  # stays a matched set.
  host-libvirglrenderer:
    name: host-libvirglrenderer-kbase-evt
    if: github.event_name == 'workflow_dispatch' && inputs.fix_kbase_evt && github.ref == 'refs/heads/diagnostic/scanout-contract-pinned-recipe'
    needs: fixed-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PANVK_PINNED: c411ef34ee47e875ca772c4f3af1133f07f969e2
    steps:
      - name: Checkout panvk CI at pinned commit
        uses: actions/checkout@v4
        with:
          repository: collegeming/panvk-mali-nctx-ci
          ref: c411ef34ee47e875ca772c4f3af1133f07f969e2
          path: panvk-ci
          persist-credentials: false
      - name: Install build tools
        run: |
          set -eux
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y meson ninja-build pkg-config
      - name: Build host libvirglrenderer with NDK (FIX_KBASE_EVT=1)
        env:
          FIX_KBASE_EVT: '1'
        run: |
          set -euo pipefail
          test "$(git -C panvk-ci rev-parse HEAD)" = "$PANVK_PINNED"
          bash panvk-ci/scripts/host-ndk/build-host-ndk.sh
          test -f out/libvirglrenderer.so
          test -s out/fix-kbase-evt.patch
          cat out/BUILD-INFO.txt
          cat out/SHA256SUMS
          (cd out && sha256sum -c SHA256SUMS)
      - name: Upload host libvirglrenderer artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvirglrenderer-mali-ndk-fixed-${{ github.run_id }}
          path: out/
          if-no-files-found: error
  # Same source lineage as the deployed runtime: Droid-VM/crosvm via the minimal manifest, built
  # with soong against the Android arm64 target (the binary the DroidVM app execs).
  android-soong:
    if: github.ref == 'refs/heads/fix/crosvm-arena-remove-writable' && (github.event_name == 'push' || inputs.phase == 'legacy-build')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Checkout patch scripts
        uses: actions/checkout@v4
        with:
          path: patch-repo
          persist-credentials: false
      - name: Free disk space
        run: |
          set -eux
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/lib/jvm /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell
          sudo apt-get clean
          sudo docker image prune -a -f || true
          df -h /
      - name: Create swap headroom
        run: |
          set -eux
          sudo fallocate -l 8G /swapfile-extra || sudo dd if=/dev/zero of=/swapfile-extra bs=1M count=8192
          sudo chmod 600 /swapfile-extra
          sudo mkswap /swapfile-extra || true
          sudo swapon /swapfile-extra || true
          free -h
          df -h /
      - name: Install repo tool
        run: |
          set -eux
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "crosvm-ci"
          git config --global user.email "crosvm-ci@users.noreply.github.com"
          git config --global http.postBuffer 524288000
      - name: Sync minimal AOSP (Droid-VM/crosvm, branch droidvm)
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/aosp"
          cd "$GITHUB_WORKSPACE/aosp"
          repo init -u https://github.com/Droid-VM/crosvm-minimal-manifest -b droidvm -m crosvm-minimal.xml --depth 1
          repo sync -c -j8 --no-tags --optimized-fetch --force-sync
          if [ ! -d external/llvm-libc ]; then
            git clone --depth 1 -b android16-qpr2-release \
              https://android.googlesource.com/platform/external/llvm-libc external/llvm-libc
          fi
          # Provenance: the tree the candidate is built from.
          git -C external/crosvm rev-parse HEAD | tee "$GITHUB_WORKSPACE/crosvm-commit.txt"
          git -C external/virglrenderer rev-parse HEAD | tee "$GITHUB_WORKSPACE/virglrenderer-commit.txt"
          df -h /
      - name: Fix gfxstream host/vulkan gettid for glibc
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/aosp"
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/fix_gfxstream_gettid.py" .
          head -5 hardware/google/gfxstream/host/vulkan/decoder_profile.cpp
          git -C hardware/google/gfxstream diff --stat | tee "$GITHUB_WORKSPACE/gfxstream-gettid-fix.txt"
          git -C hardware/google/gfxstream diff --binary > "$GITHUB_WORKSPACE/gfxstream-gettid.patch"
      - name: Provide placeholders for missing include_bytes assets
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/aosp"
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/provide_missing_include_bytes.py" external/crosvm \
            | tee "$GITHUB_WORKSPACE/include-bytes-placeholders.txt"
          {
            echo "dummy include_bytes placeholders (1 byte): KVM candidate only; Gunyah/unused prebuilt assets are not exercised"
            cat "$GITHUB_WORKSPACE/include-bytes-placeholders.txt"
          } > "$GITHUB_WORKSPACE/BUILD-INFO.txt"
          cat "$GITHUB_WORKSPACE/BUILD-INFO.txt"
      - name: Verify the crosvm module is in the synced tree
        run: |
          set -eux
          test -f "$GITHUB_WORKSPACE/aosp/external/crosvm/Android.bp"
          grep -n 'name: "crosvm"' "$GITHUB_WORKSPACE/aosp/external/crosvm/Android.bp"
      - name: Apply arena-remove-writable patch
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/aosp"
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/patch_crosvm_arena_remove_writable.py" external/crosvm
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/patch_crosvm_arena_remove_writable.py" external/crosvm --check
          # Build-time only, not part of the behavior change: the candidate is the Android target
          # binary. `m crosvm` otherwise also builds the host variant, which pulls
          # hardware/google/gfxstream host/vulkan/decoder_profile.cpp and fails on this glibc
          # toolchain with "use of undeclared identifier 'gettid'". The host binary is not shipped.
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/disable_crosvm_host_variant.py" external/crosvm
          grep -n 'host_supported: false' external/crosvm/Android.bp | tee "$GITHUB_WORKSPACE/host-variant-disabled.txt"
          git -C "$GITHUB_WORKSPACE/aosp/external/crosvm" diff --stat | tee "$GITHUB_WORKSPACE/patch-stat.txt"
          git -C "$GITHUB_WORKSPACE/aosp/external/crosvm" diff --binary > "$GITHUB_WORKSPACE/source.patch"
          test -s "$GITHUB_WORKSPACE/source.patch"
      - name: Build crosvm
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/aosp"
          source build/envsetup.sh
          lunch aosp_arm64 trunk_staging eng
          free -h
          df -h /
          # crosvm_device_only_bin is the same source/features as the main crosvm module but is
          # not apex_available, so it never pulls the com.android.virt APEX (the minimal manifest
          # lacks android_bootloader_crosvm_aarch64). Stem is "crosvm"; crosvm_device_only is the
          # phony that makes the installable:false module buildable.
          ALLOW_MISSING_DEPENDENCIES=true SOONG_ALLOW_MISSING_DEPENDENCIES=true \
            TARGET_BUILD_UNBUNDLED=true m crosvm_device_only -j2 2>&1 | tee "$GITHUB_WORKSPACE/soong-crosvm.log" || true
          # The linked binary lives in soong intermediates (installable:false), so list both the
          # documented device-only path and any other crosvm-named ELF.
          find out/soong/.intermediates/external/crosvm/crosvm_device_only -type f -name crosvm -print 2>/dev/null || true
          find out -type f -name crosvm -print | tee "$GITHUB_WORKSPACE/crosvm-candidates.txt" || true
          free -h
          df -h /
      - name: Collect candidate
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/aosp"
          mkdir -p "$GITHUB_WORKSPACE/out"
          pick=""
          pick_size=0
          while IFS= read -r f; do
            if readelf -h "$f" 2>/dev/null | grep -q 'AArch64'; then
              sz=$(stat -c %s "$f")
              if [ "$sz" -gt "$pick_size" ]; then pick="$f"; pick_size=$sz; fi
            fi
          done < <(find out -type f -name crosvm)
          if [ -z "$pick" ]; then
            echo "no AArch64 crosvm produced; build tail:"
            tail -100 "$GITHUB_WORKSPACE/soong-crosvm.log" || true
            exit 1
          fi
          echo "picked: $pick ($pick_size bytes)" | tee "$GITHUB_WORKSPACE/picked.txt"
          cp "$pick" "$GITHUB_WORKSPACE/out/crosvm"
          readelf -h -d "$GITHUB_WORKSPACE/out/crosvm" > "$GITHUB_WORKSPACE/out/crosvm-elf.txt"
          (cd "$GITHUB_WORKSPACE/out" && sha256sum crosvm > SHA256SUMS)
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: crosvm-arena-writable-${{ github.run_id }}
          path: |
            out/
            source.patch
            patch-stat.txt
            host-variant-disabled.txt
            gfxstream-gettid-fix.txt
            gfxstream-gettid.patch
            crosvm-commit.txt
            virglrenderer-commit.txt
            soong-crosvm.log
            crosvm-candidates.txt
            picked.txt
            include-bytes-placeholders.txt
            BUILD-INFO.txt
          if-no-files-found: error

  # Host-side regression test for the changed function. Runs on the same file content as the
  # soong tree (the pinned production tree carries an identical base/src/sys/linux/mmap.rs).
  host-unit-test:
    if: github.ref == 'refs/heads/fix/crosvm-arena-remove-writable' && (github.event_name == 'push' || inputs.phase == 'legacy-build')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CROSVM_COMMIT: 849e05f12d5c8d4c36af8e15763986d242cd43b5
      MINIJAIL_COMMIT: 8330e01d0fd55dfe505890eb5f829b77ac4ca8cb
      RUSTUP_TOOLCHAIN: 1.90.0
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout patch scripts
        uses: actions/checkout@v4
        with:
          path: patch-repo
          persist-credentials: false
      - name: Checkout pinned crosvm source
        uses: actions/checkout@v4
        with:
          repository: collegeming/crosvm
          ref: ${{ env.CROSVM_COMMIT }}
          path: source
          persist-credentials: false
      - name: Materialize minijail beside the source
        uses: actions/checkout@v4
        with:
          repository: google/minijail
          ref: ${{ env.MINIJAIL_COMMIT }}
          path: minijail
          persist-credentials: false
      - name: Apply patch
        run: |
          set -eux
          python3 -I patch-repo/scripts/patch_crosvm_arena_remove_writable.py "$GITHUB_WORKSPACE/source"
          python3 -I patch-repo/scripts/patch_crosvm_arena_remove_writable.py "$GITHUB_WORKSPACE/source" --check
          git -C source diff --check
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libcap-dev libelf-dev libssl-dev
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup run "$RUSTUP_TOOLCHAIN" cargo --version
      - name: Run the base arena tests
        run: |
          cd source
          cargo +"$RUSTUP_TOOLCHAIN" test --locked -p base --lib -- arena_remove --nocapture 2>&1 | tee ../base-tests.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crosvm-arena-tests-${{ github.run_id }}
          path: base-tests.log
          if-no-files-found: warn
