name: build-crosvm-arena-remove-writable
# Candidate-only build. Nothing here deploys to a device.
#
# Patch under test: MemoryMappingArena::remove() fills a removed sub-range with an anonymous
# PRIVATE READ-WRITE mapping instead of PROT_READ. The virtio-gpu shared-memory BAR is one KVM
# memslot, so a read-only fill makes a guest write take a stage-2 permission fault that arm64 KVM
# resolves as -EFAULT from KVM_RUN (kvm_s2_fault_pin_pfn -> __kvm_faultin_pfn ->
# KVM_PFN_ERR_RO_FAULT); crosvm's vCPU loop then exits the VM with
# "vcpu hit unknown error: Bad address (os error 14)".
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Resolve lock, dry preflight, or explicitly build NEW fixed baseline; never deploys'
        type: choice
        options: [resolve, preflight, fixed-baseline, legacy-build]
        default: resolve
        required: true
  push:
    branches: [fix/crosvm-arena-remove-writable]
    paths:
      - '.github/workflows/build-crosvm-arena-remove-writable.yml'
      - 'scripts/patch_crosvm_arena_remove_writable.py'
permissions:
  contents: read
concurrency:
  group: crosvm-arena-remove-writable
  cancel-in-progress: false
jobs:
  resolve-manifest:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'resolve'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed resolver only
        uses: actions/checkout@v4
        with:
          path: patch-repo
          persist-credentials: false
      - name: Resolver selfcheck (CI only, no build)
        run: python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/lock_crosvm_manifest.py" --selfcheck
      - name: Checkout exact input manifest (not deployed-run reconstruction)
        uses: actions/checkout@v4
        with:
          repository: Droid-VM/crosvm-minimal-manifest
          ref: 6ee0c357c461f09245a0378c55459993f067876e
          path: manifest-source
          persist-credentials: false
      - name: Resolve every project and supplemental llvm-libc to full SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/manifest-source" rev-parse HEAD)" = 6ee0c357c461f09245a0378c55459993f067876e
          test ! -e "$GITHUB_WORKSPACE/manifest-lock"
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/lock_crosvm_manifest.py" \
            --manifest "$GITHUB_WORKSPACE/manifest-source/crosvm-minimal.xml" \
            --output "$GITHUB_WORKSPACE/manifest-lock"
          {
            echo 'NEW_FIXED_BASELINE_NOT_DEPLOYED_REPRODUCTION'
            echo 'Historical run43938110284 did not publish a complete resolved manifest.'
            echo 'NOT_BUILT; NOT_DEVICE_TESTED; no source sync or compile performed.'
            git -C "$GITHUB_WORKSPACE/patch-repo" rev-parse HEAD
            git --version
            python3 --version
            sha256sum "$GITHUB_WORKSPACE/patch-repo/scripts/lock_crosvm_manifest.py"
          } > "$GITHUB_WORKSPACE/manifest-lock/BUILD-INFO.txt"
          cd "$GITHUB_WORKSPACE/manifest-lock"
          sha256sum input-manifest.xml resolved-manifest.xml lock-info.json BUILD-INFO.txt > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Upload lock for independent review (never auto-build)
        uses: actions/upload-artifact@v4
        with:
          name: crosvm-new-fixed-manifest-${{ github.run_id }}
          path: manifest-lock/
          if-no-files-found: error
  fixed-preflight:
    if: github.event_name == 'workflow_dispatch' && (inputs.phase == 'preflight' || inputs.phase == 'fixed-baseline')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: patch-repo
          persist-credentials: false
      - name: Verify locked inputs and run dry metadata admission selfcheck
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/patch-repo/manifests/new-fixed-44129434140"
          sha256sum -c SHA256SUMS
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/check_crosvm_fixed_build.py" --lock "$PWD" --selfcheck
  fixed-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'fixed-baseline' && github.ref == 'refs/heads/diagnostic/scanout-contract-pinned-recipe'
    needs: fixed-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: '2'
      LOCK: ${{ github.workspace }}/patch-repo/manifests/new-fixed-44129434140
      EVIDENCE: ${{ github.workspace }}/fixed-evidence
      EXACT_OUTPUT: out/soong/.intermediates/external/crosvm/crosvm_device_only/crosvm_device_only_bin/android_arm64_armv8-a/unstripped/crosvm
    steps:
      - uses: actions/checkout@v4
        with:
          path: patch-repo
          persist-credentials: false
      - name: Checkout exact historical compatibility helpers (not current HEAD helpers)
        uses: actions/checkout@v4
        with:
          ref: 3c20ef7b333755e488f92946249ae92660385f35
          path: compat-repo
          persist-credentials: false
      - name: Checkout pinned repo launcher
        uses: actions/checkout@v4
        with:
          repository: GerritCodeReview/git-repo
          ref: 97dc5c1bd9527c2abe2183b16a4b7ef037dc34a7
          path: repo-tool
          persist-credentials: false
      - name: Prepare isolated runner and evidence (no device access)
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$GITHUB_WORKSPACE/aosp"
          mkdir "$EVIDENCE" "$GITHUB_WORKSPACE/aosp" "$GITHUB_WORKSPACE/locked-manifest-repo"
          cp "$LOCK/"* "$EVIDENCE/"
          (cd "$LOCK" && sha256sum -c SHA256SUMS)
          test "$(git -C "$GITHUB_WORKSPACE/compat-repo" rev-parse HEAD)" = 3c20ef7b333755e488f92946249ae92660385f35
          test "$(git -C "$GITHUB_WORKSPACE/repo-tool" rev-parse HEAD)" = 97dc5c1bd9527c2abe2183b16a4b7ef037dc34a7
          sha256sum "$GITHUB_WORKSPACE/compat-repo/scripts/"{patch_crosvm_arena_remove_writable,fix_gfxstream_gettid,provide_missing_include_bytes,disable_crosvm_host_variant}.py > "$EVIDENCE/compat-helper-SHA256SUMS"
          cp "$LOCK/resolved-manifest.xml" "$GITHUB_WORKSPACE/locked-manifest-repo/default.xml"
          git -C "$GITHUB_WORKSPACE/locked-manifest-repo" init -b main
          git -C "$GITHUB_WORKSPACE/locked-manifest-repo" add default.xml
          git -C "$GITHUB_WORKSPACE/locked-manifest-repo" -c user.name=crosvm-ci -c user.email=crosvm-ci@users.noreply.github.com commit -m 'Exact verified 97-project lock'
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/lib/jvm /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell
          sudo apt-get clean
          sudo docker image prune -a -f
          sudo fallocate -l 8G /swapfile-fixed
          sudo chmod 600 /swapfile-fixed
          sudo mkswap /swapfile-fixed
          sudo swapon /swapfile-fixed
      - name: Sync ONLY full-SHA manifest then verify every pristine project HEAD
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/aosp"
          python3 -I "$GITHUB_WORKSPACE/repo-tool/repo" init \
            -u "file://$GITHUB_WORKSPACE/locked-manifest-repo" -b main -m default.xml --depth 1 \
            --repo-rev=v2.54
          test "$(git -C .repo/repo rev-parse HEAD)" = 97dc5c1bd9527c2abe2183b16a4b7ef037dc34a7
          python3 -I "$GITHUB_WORKSPACE/repo-tool/repo" sync -c -j8 --no-tags --optimized-fetch
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/check_crosvm_fixed_build.py" \
            --lock "$LOCK" --tree "$PWD" --evidence "$EVIDENCE/verified-project-heads.json"
          python3 -I "$GITHUB_WORKSPACE/repo-tool/repo" manifest -r -o "$EVIDENCE/synced-resolved-manifest.xml"
      - name: Apply historical paired arena and Android build compatibility only
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/aosp"
          H="$GITHUB_WORKSPACE/compat-repo/scripts"
          python3 -I "$H/fix_gfxstream_gettid.py" .
          python3 -I "$H/provide_missing_include_bytes.py" external/crosvm | tee "$EVIDENCE/include-bytes-placeholders.txt"
          python3 -I "$H/patch_crosvm_arena_remove_writable.py" external/crosvm
          python3 -I "$H/patch_crosvm_arena_remove_writable.py" external/crosvm --check
          python3 -I "$H/disable_crosvm_host_variant.py" external/crosvm
          git -C external/crosvm diff --check
          git -C hardware/google/gfxstream diff --check
          git -C external/crosvm diff --binary > "$EVIDENCE/source.patch"
          git -C hardware/google/gfxstream diff --binary > "$EVIDENCE/gfxstream-gettid.patch"
          sha256sum "$EVIDENCE/source.patch" "$EVIDENCE/gfxstream-gettid.patch" > "$EVIDENCE/patch-SHA256SUMS"
      - name: Build current exact device-only module; any m failure stops admission
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/aosp"
          test ! -e out
          source build/envsetup.sh
          lunch aosp_arm64 trunk_staging eng
          test ! -e "$EXACT_OUTPUT"
          touch "$EVIDENCE/build-start"
          ALLOW_MISSING_DEPENDENCIES=true SOONG_ALLOW_MISSING_DEPENDENCIES=true \
            TARGET_BUILD_UNBUNDLED=true m crosvm_device_only -j2 2>&1 | tee "$EVIDENCE/soong-crosvm.log"
          test "$EXACT_OUTPUT" -nt "$EVIDENCE/build-start"
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/check_crosvm_fixed_build.py" \
            --lock "$LOCK" --tree "$PWD" --log "$EVIDENCE/soong-crosvm.log" --evidence "$EVIDENCE/output-admission.json"
          readelf -h -d "$EXACT_OUTPUT" > "$EVIDENCE/crosvm-elf.txt"
          # Graph path is printed by historical soong-crosvm.log:291. -t commands never builds.
          test -s out/soong/build.aosp_arm64.ninja
          prebuilts/build-tools/linux-x86/bin/ninja -f out/soong/build.aosp_arm64.ninja \
            -t commands "$EXACT_OUTPUT" > "$EVIDENCE/device-only-link-commands.txt"
          test -s "$EVIDENCE/device-only-link-commands.txt"
          cp "$EXACT_OUTPUT" "$EVIDENCE/crosvm"
          cp build/soong/rust/config/global.go "$EVIDENCE/rust-toolchain-config.go"
          cp build/soong/cc/config/global.go "$EVIDENCE/clang-toolchain-config.go"
          # Record every available compiler version, not a guessed active compiler.
          for compiler in prebuilts/rust/linux-x86/*/bin/rustc prebuilts/clang/host/linux-x86/clang-*/bin/clang; do
            if [ -x "$compiler" ]; then
              printf '\n%s\n' "$compiler"
              "$compiler" --version
              sha256sum "$compiler"
            fi
          done > "$EVIDENCE/compiler-versions.txt"
          {
            echo 'NEW_FIXED_BASELINE_NOT_DEPLOYED_REPRODUCTION; baseline only, no metadata candidate'
            echo 'NOT_DEVICE_TESTED; no deployment; Gunyah placeholders not exercised (KVM only)'
            printf 'exact_output=%s\n' "$EXACT_OUTPUT"
            echo 'target=aosp_arm64/trunk_staging/eng; module=crosvm_device_only; jobs=2'
            echo 'ALLOW_MISSING_DEPENDENCIES=true SOONG_ALLOW_MISSING_DEPENDENCIES=true TARGET_BUILD_UNBUNDLED=true'
            git -C "$GITHUB_WORKSPACE/patch-repo" rev-parse HEAD
            git -C "$GITHUB_WORKSPACE/compat-repo" rev-parse HEAD
            sha256sum "$LOCK/resolved-manifest.xml" "$EVIDENCE/"{source.patch,gfxstream-gettid.patch,crosvm}
            echo 'Actual module compile/link commands: device-only-link-commands.txt (ninja -t commands; no rebuild)'
            sha256sum "$EVIDENCE/device-only-link-commands.txt" "$EVIDENCE/"{rust-toolchain-config.go,clang-toolchain-config.go}
            cat "$EVIDENCE/compiler-versions.txt" "$EVIDENCE/compat-helper-SHA256SUMS" "$EVIDENCE/include-bytes-placeholders.txt"
          } > "$EVIDENCE/BUILD-INFO.txt"
          (cd "$EVIDENCE" && sha256sum crosvm source.patch gfxstream-gettid.patch resolved-manifest.xml input-manifest.xml lock-info.json synced-resolved-manifest.xml verified-project-heads.json output-admission.json compiler-versions.txt device-only-link-commands.txt rust-toolchain-config.go clang-toolchain-config.go compat-helper-SHA256SUMS patch-SHA256SUMS include-bytes-placeholders.txt soong-crosvm.log crosvm-elf.txt BUILD-INFO.txt > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Upload successful fixed baseline only
        uses: actions/upload-artifact@v4
        with:
          name: crosvm-new-fixed-baseline-${{ github.run_id }}
          path: fixed-evidence/
          if-no-files-found: error
      - name: Preserve failure evidence without publishing a baseline artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crosvm-fixed-build-failure-${{ github.run_id }}
          path: |
            fixed-evidence/*.log
            fixed-evidence/*manifest.xml
            fixed-evidence/*heads.json
            fixed-evidence/*.patch
            fixed-evidence/*SHA256SUMS
          if-no-files-found: warn
  # Same source lineage as the deployed runtime: Droid-VM/crosvm via the minimal manifest, built
  # with soong against the Android arm64 target (the binary the DroidVM app execs).
  android-soong:
    if: github.ref == 'refs/heads/fix/crosvm-arena-remove-writable' && (github.event_name == 'push' || inputs.phase == 'legacy-build')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Checkout patch scripts
        uses: actions/checkout@v4
        with:
          path: patch-repo
          persist-credentials: false
      - name: Free disk space
        run: |
          set -eux
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/lib/jvm /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell
          sudo apt-get clean
          sudo docker image prune -a -f || true
          df -h /
      - name: Create swap headroom
        run: |
          set -eux
          sudo fallocate -l 8G /swapfile-extra || sudo dd if=/dev/zero of=/swapfile-extra bs=1M count=8192
          sudo chmod 600 /swapfile-extra
          sudo mkswap /swapfile-extra || true
          sudo swapon /swapfile-extra || true
          free -h
          df -h /
      - name: Install repo tool
        run: |
          set -eux
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "crosvm-ci"
          git config --global user.email "crosvm-ci@users.noreply.github.com"
          git config --global http.postBuffer 524288000
      - name: Sync minimal AOSP (Droid-VM/crosvm, branch droidvm)
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/aosp"
          cd "$GITHUB_WORKSPACE/aosp"
          repo init -u https://github.com/Droid-VM/crosvm-minimal-manifest -b droidvm -m crosvm-minimal.xml --depth 1
          repo sync -c -j8 --no-tags --optimized-fetch --force-sync
          if [ ! -d external/llvm-libc ]; then
            git clone --depth 1 -b android16-qpr2-release \
              https://android.googlesource.com/platform/external/llvm-libc external/llvm-libc
          fi
          # Provenance: the tree the candidate is built from.
          git -C external/crosvm rev-parse HEAD | tee "$GITHUB_WORKSPACE/crosvm-commit.txt"
          git -C external/virglrenderer rev-parse HEAD | tee "$GITHUB_WORKSPACE/virglrenderer-commit.txt"
          df -h /
      - name: Fix gfxstream host/vulkan gettid for glibc
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/aosp"
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/fix_gfxstream_gettid.py" .
          head -5 hardware/google/gfxstream/host/vulkan/decoder_profile.cpp
          git -C hardware/google/gfxstream diff --stat | tee "$GITHUB_WORKSPACE/gfxstream-gettid-fix.txt"
          git -C hardware/google/gfxstream diff --binary > "$GITHUB_WORKSPACE/gfxstream-gettid.patch"
      - name: Provide placeholders for missing include_bytes assets
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/aosp"
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/provide_missing_include_bytes.py" external/crosvm \
            | tee "$GITHUB_WORKSPACE/include-bytes-placeholders.txt"
          {
            echo "dummy include_bytes placeholders (1 byte): KVM candidate only; Gunyah/unused prebuilt assets are not exercised"
            cat "$GITHUB_WORKSPACE/include-bytes-placeholders.txt"
          } > "$GITHUB_WORKSPACE/BUILD-INFO.txt"
          cat "$GITHUB_WORKSPACE/BUILD-INFO.txt"
      - name: Verify the crosvm module is in the synced tree
        run: |
          set -eux
          test -f "$GITHUB_WORKSPACE/aosp/external/crosvm/Android.bp"
          grep -n 'name: "crosvm"' "$GITHUB_WORKSPACE/aosp/external/crosvm/Android.bp"
      - name: Apply arena-remove-writable patch
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/aosp"
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/patch_crosvm_arena_remove_writable.py" external/crosvm
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/patch_crosvm_arena_remove_writable.py" external/crosvm --check
          # Build-time only, not part of the behavior change: the candidate is the Android target
          # binary. `m crosvm` otherwise also builds the host variant, which pulls
          # hardware/google/gfxstream host/vulkan/decoder_profile.cpp and fails on this glibc
          # toolchain with "use of undeclared identifier 'gettid'". The host binary is not shipped.
          python3 -I "$GITHUB_WORKSPACE/patch-repo/scripts/disable_crosvm_host_variant.py" external/crosvm
          grep -n 'host_supported: false' external/crosvm/Android.bp | tee "$GITHUB_WORKSPACE/host-variant-disabled.txt"
          git -C "$GITHUB_WORKSPACE/aosp/external/crosvm" diff --stat | tee "$GITHUB_WORKSPACE/patch-stat.txt"
          git -C "$GITHUB_WORKSPACE/aosp/external/crosvm" diff --binary > "$GITHUB_WORKSPACE/source.patch"
          test -s "$GITHUB_WORKSPACE/source.patch"
      - name: Build crosvm
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/aosp"
          source build/envsetup.sh
          lunch aosp_arm64 trunk_staging eng
          free -h
          df -h /
          # crosvm_device_only_bin is the same source/features as the main crosvm module but is
          # not apex_available, so it never pulls the com.android.virt APEX (the minimal manifest
          # lacks android_bootloader_crosvm_aarch64). Stem is "crosvm"; crosvm_device_only is the
          # phony that makes the installable:false module buildable.
          ALLOW_MISSING_DEPENDENCIES=true SOONG_ALLOW_MISSING_DEPENDENCIES=true \
            TARGET_BUILD_UNBUNDLED=true m crosvm_device_only -j2 2>&1 | tee "$GITHUB_WORKSPACE/soong-crosvm.log" || true
          # The linked binary lives in soong intermediates (installable:false), so list both the
          # documented device-only path and any other crosvm-named ELF.
          find out/soong/.intermediates/external/crosvm/crosvm_device_only -type f -name crosvm -print 2>/dev/null || true
          find out -type f -name crosvm -print | tee "$GITHUB_WORKSPACE/crosvm-candidates.txt" || true
          free -h
          df -h /
      - name: Collect candidate
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/aosp"
          mkdir -p "$GITHUB_WORKSPACE/out"
          pick=""
          pick_size=0
          while IFS= read -r f; do
            if readelf -h "$f" 2>/dev/null | grep -q 'AArch64'; then
              sz=$(stat -c %s "$f")
              if [ "$sz" -gt "$pick_size" ]; then pick="$f"; pick_size=$sz; fi
            fi
          done < <(find out -type f -name crosvm)
          if [ -z "$pick" ]; then
            echo "no AArch64 crosvm produced; build tail:"
            tail -100 "$GITHUB_WORKSPACE/soong-crosvm.log" || true
            exit 1
          fi
          echo "picked: $pick ($pick_size bytes)" | tee "$GITHUB_WORKSPACE/picked.txt"
          cp "$pick" "$GITHUB_WORKSPACE/out/crosvm"
          readelf -h -d "$GITHUB_WORKSPACE/out/crosvm" > "$GITHUB_WORKSPACE/out/crosvm-elf.txt"
          (cd "$GITHUB_WORKSPACE/out" && sha256sum crosvm > SHA256SUMS)
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: crosvm-arena-writable-${{ github.run_id }}
          path: |
            out/
            source.patch
            patch-stat.txt
            host-variant-disabled.txt
            gfxstream-gettid-fix.txt
            gfxstream-gettid.patch
            crosvm-commit.txt
            virglrenderer-commit.txt
            soong-crosvm.log
            crosvm-candidates.txt
            picked.txt
            include-bytes-placeholders.txt
            BUILD-INFO.txt
          if-no-files-found: error

  # Host-side regression test for the changed function. Runs on the same file content as the
  # soong tree (the pinned production tree carries an identical base/src/sys/linux/mmap.rs).
  host-unit-test:
    if: github.ref == 'refs/heads/fix/crosvm-arena-remove-writable' && (github.event_name == 'push' || inputs.phase == 'legacy-build')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CROSVM_COMMIT: 849e05f12d5c8d4c36af8e15763986d242cd43b5
      MINIJAIL_COMMIT: 8330e01d0fd55dfe505890eb5f829b77ac4ca8cb
      RUSTUP_TOOLCHAIN: 1.90.0
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout patch scripts
        uses: actions/checkout@v4
        with:
          path: patch-repo
          persist-credentials: false
      - name: Checkout pinned crosvm source
        uses: actions/checkout@v4
        with:
          repository: collegeming/crosvm
          ref: ${{ env.CROSVM_COMMIT }}
          path: source
          persist-credentials: false
      - name: Materialize minijail beside the source
        uses: actions/checkout@v4
        with:
          repository: google/minijail
          ref: ${{ env.MINIJAIL_COMMIT }}
          path: minijail
          persist-credentials: false
      - name: Apply patch
        run: |
          set -eux
          python3 -I patch-repo/scripts/patch_crosvm_arena_remove_writable.py "$GITHUB_WORKSPACE/source"
          python3 -I patch-repo/scripts/patch_crosvm_arena_remove_writable.py "$GITHUB_WORKSPACE/source" --check
          git -C source diff --check
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libcap-dev libelf-dev libssl-dev
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup run "$RUSTUP_TOOLCHAIN" cargo --version
      - name: Run the base arena tests
        run: |
          cd source
          cargo +"$RUSTUP_TOOLCHAIN" test --locked -p base --lib -- arena_remove --nocapture 2>&1 | tee ../base-tests.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crosvm-arena-tests-${{ github.run_id }}
          path: base-tests.log
          if-no-files-found: warn
