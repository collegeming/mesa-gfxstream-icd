name: build-droidvm-mali-host

on:
  workflow_dispatch:
  push:
    branches: [diagnostic/droidvm-mali-host, diagnostic/coherent-contract-v1, diagnostic/native-backing-lease, diagnostic/native-roundtrip-trace, diagnostic/native-cpu-crossview, diagnostic/native-cpu-reverse, diagnostic/native-cpu-prefault, diagnostic/native-cpu-prewrite, diagnostic/niri-image-external-types, diagnostic/niri-image-query-trace, diagnostic/niri-classic-image-bridge, diagnostic/niri-cib-diagnostics]
    paths:
      - '.github/workflows/build-droidvm-mali-host.yml'
      - 'scripts/patch_droidvm_build.py'
      - 'scripts/patch_droidvm_mali_host.py'
      - 'scripts/dmabuf_import_guard.h'
      - 'scripts/test_dmabuf_import_guard.cpp'
      - 'scripts/staging_contract.h'
      - 'scripts/test_staging_contract.cpp'
      - 'scripts/host_memory_contract.h'
      - 'scripts/test_host_memory_contract.cpp'
      - 'scripts/test_host_memory_integration.py'
      - 'scripts/*native_backing*'
      - 'scripts/*native_roundtrip*'
      - 'scripts/*native_cpu_crossview*'
      - 'scripts/*native_cpu_reverse*'
      - 'scripts/*native_cpu_prefault*'
      - 'scripts/*niri_image_external_types*'
      - 'scripts/*niri_image_query_trace*'
      - 'scripts/*classic_image_bridge*'
      - 'scripts/*niri_cib_diagnostics*'

permissions:
  contents: read

concurrency:
  group: droidvm-mali-host-${{ github.ref }}
  cancel-in-progress: false

env:
  GFXSTREAM_COMMIT: cbc6df3b11b3eac8fb13d89e0a542f763b3bdfcc
  VULKAN_HEADERS_TAG_OBJECT: 43711cfe7d642355a20af7c0a850ef4de88bcb60
  VULKAN_HEADERS_COMMIT: 11d6898377797e07dbd543aaaa367e4465074597

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ci
          persist-credentials: false

      - name: Checkout pinned DroidVM gfxstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: collegeming/gfxstream-1
          ref: ${{ env.GFXSTREAM_COMMIT }}
          path: source
          persist-credentials: false

      - name: Checkout pinned Vulkan-Headers 1.4.358
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_COMMIT }}
          path: vulkan-headers
          persist-credentials: false

      - name: Verify pins, replace headers, and apply minimal patches
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$GFXSTREAM_COMMIT"
          test "$(git -C vulkan-headers rev-parse HEAD)" = "$VULKAN_HEADERS_COMMIT"
          grep -Eq '^#define VK_HEADER_VERSION 358$' vulkan-headers/include/vulkan/vulkan_core.h
          rm -rf source/third_party/vulkan_headers
          mkdir source/third_party/vulkan_headers
          git -C vulkan-headers archive HEAD | tar -x -C source/third_party/vulkan_headers
          python3 -I ci/scripts/patch_droidvm_build.py "$GITHUB_WORKSPACE/source"
          python3 -I ci/scripts/patch_droidvm_mali_host.py "$GITHUB_WORKSPACE/source"
          python3 -I ci/scripts/patch_native_backing_lease.py "$GITHUB_WORKSPACE/source"
          mkdir "$RUNNER_TEMP/native-roundtrip-before"
          cp source/host/vulkan/vk_decoder_global_state.cpp source/host/vulkan/vk_decoder.cpp source/host/vulkan/vk_sub_decoder.cpp "$RUNNER_TEMP/native-roundtrip-before/"
          python3 -I ci/scripts/patch_native_roundtrip_trace.py "$GITHUB_WORKSPACE/source"
          python3 -I ci/scripts/test_native_roundtrip_integration.py "$RUNNER_TEMP/native-roundtrip-before" "$GITHUB_WORKSPACE/source"
          mkdir "$RUNNER_TEMP/native-crossview-before"
          cp source/host/vulkan/vk_decoder_global_state.cpp source/host/vulkan/vk_decoder.cpp source/host/vulkan/vk_sub_decoder.cpp "$RUNNER_TEMP/native-crossview-before/"
          python3 -I ci/scripts/patch_native_cpu_crossview.py "$GITHUB_WORKSPACE/source"
          python3 -I ci/scripts/test_native_cpu_crossview_integration.py "$RUNNER_TEMP/native-crossview-before" "$GITHUB_WORKSPACE/source"
          mkdir "$RUNNER_TEMP/native-prefault-before"
          cp source/host/vulkan/vk_decoder_global_state.cpp source/host/vulkan/vk_decoder.cpp source/host/vulkan/vk_sub_decoder.cpp "$RUNNER_TEMP/native-prefault-before/"
          python3 -I ci/scripts/patch_native_cpu_prefault.py "$GITHUB_WORKSPACE/source"
          python3 -I ci/scripts/patch_niri_image_external_types.py "$GITHUB_WORKSPACE/source"
          mkdir "$RUNNER_TEMP/niri-image-trace-before"
          cp source/host/vulkan/vk_decoder_global_state.cpp source/host/vulkan/vk_decoder.cpp "$RUNNER_TEMP/niri-image-trace-before/"
          python3 -I ci/scripts/patch_niri_image_query_trace.py "$GITHUB_WORKSPACE/source"
          python3 -I ci/scripts/test_niri_image_query_trace.py "$RUNNER_TEMP/niri-image-trace-before" "$GITHUB_WORKSPACE/source"
          python3 -I ci/scripts/test_native_cpu_prefault_integration.py "$RUNNER_TEMP/native-prefault-before" "$GITHUB_WORKSPACE/source"
          git -C source diff --check
          mkdir out
          git -C source diff --binary -- . ':!third_party/vulkan_headers' > out/gfxstream-android-mali.patch
          git -C source diff --stat -- . ':!third_party/vulkan_headers'
          cp ci/scripts/patch_droidvm_build.py ci/scripts/patch_droidvm_mali_host.py out/
          cp ci/.github/workflows/build-droidvm-mali-host.yml out/
          cp ci/scripts/dmabuf_import_guard.h ci/scripts/test_dmabuf_import_guard.cpp out/
          cp ci/scripts/staging_contract.h ci/scripts/test_staging_contract.cpp out/
          cp ci/scripts/host_memory_contract.h ci/scripts/test_host_memory_contract.cpp out/
          cp ci/scripts/test_host_memory_integration.py out/
          cp ci/scripts/*native_backing* out/
          cp ci/scripts/*native_roundtrip* out/
          cp ci/scripts/*native_cpu_crossview* out/
          cp ci/scripts/*native_cpu_reverse* out/
          cp ci/scripts/*native_cpu_prefault* out/
          cp ci/scripts/*niri_image_external_types* out/
          cp ci/scripts/*niri_image_query_trace* out/
          python3 -I ci/scripts/test_niri_image_query_trace.py "$RUNNER_TEMP/niri-image-trace-before" "$GITHUB_WORKSPACE/source" > out/niri-image-query-trace-tests.txt

      - name: Run host-only DMA_BUF guard mock-dispatch tests (no GPU)
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ivulkan-headers/include -Ici/scripts \
            ci/scripts/test_dmabuf_import_guard.cpp -o "$RUNNER_TEMP/test-dmabuf-import-guard"
          "$RUNNER_TEMP/test-dmabuf-import-guard" | tee out/dmabuf-guard-tests.txt
          python3 -I - <<'PY' | tee -a out/dmabuf-guard-tests.txt
          from pathlib import Path
          decoder = Path('source/host/vulkan/vk_decoder_global_state.cpp').read_text()
          internal = Path('source/host/vulkan/vk_common_operations.cpp').read_text()
          extensions = decoder[decoder.index('    std::vector<const char*> filteredDeviceExtensionNames('):]
          extensions = extensions[:extensions.index('    std::vector<const char*> filteredInstanceExtensionNames(')]
          assert 'hostAlwaysDeviceExtensions.push_back(VK_KHR_EXTERNAL_MEMORY_FD_EXTENSION_NAME);' in extensions
          assert 'if (hasDeviceExtension(properties, extName))' in extensions
          assert extensions.index('VK_KHR_EXTERNAL_MEMORY_FD_EXTENSION_NAME') < extensions.index('if (hasDeviceExtension(properties, extName))')
          start = internal.index('    if (emulation->mDeviceInfo.supportsDmaBuf) {')
          internal_gate = internal[start:internal.index('#endif', start)]
          assert 'vk_util::extensionSupported(emulation->mDeviceInfo.extensions,' in internal_gate
          assert 'VK_KHR_EXTERNAL_MEMORY_FD_EXTENSION_NAME))' in internal_gate
          assert 'selectedDeviceExtensionNames.emplace(VK_KHR_EXTERNAL_MEMORY_FD_EXTENSION_NAME);' in internal_gate
          print('PASS: both DMA_BUF device lists request KHR_external_memory_fd through supported-extension gates')
          PY

      - name: Run shared production staging contract tests (CPU mocks only)
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer             -Ivulkan-headers/include -Ici/scripts             ci/scripts/test_staging_contract.cpp -o "$RUNNER_TEMP/test-staging-contract"
          "$RUNNER_TEMP/test-staging-contract" | tee out/staging-contract-tests.txt
          "$RUNNER_TEMP/test-staging-contract" --destroy-inflight
          printf 'PASS: in-flight C++ destruction rejected by lifetime invariant\n' | tee -a out/staging-contract-tests.txt
          python3 -I - <<'PY_CHECK' | tee -a out/staging-contract-tests.txt
          from pathlib import Path
          decoder = Path('source/host/vulkan/vk_decoder_global_state.cpp').read_text()
          helper = Path('ci/scripts/staging_contract.h').read_text().replace('#pragma once\n', '')
          assert helper in decoder
          start = decoder.index('    VkResult on_vkAllocateMemory(')
          end = decoder.index('        VkResult result = vk->vkAllocateMemory(', start)
          allocation = decoder[start:end]
          gate = allocation.index('"GFXSTREAM_EXPERIMENTAL_STAGING_CONTRACT") == "1"')
          assert gate < allocation.index('HostVisibleFolioCharge folioCharge;')
          assert gate < allocation.index('validateHostVisibleDmaBufImport(')
          assert 'staging::Readiness readiness{};' in allocation
          assert 'readiness.directMapping = usingDirectMapping();' in allocation
          assert '(guestMemoryPropertyFlags & VK_MEMORY_PROPERTY_HOST_COHERENT_BIT) != 0' in allocation
          assert 'readiness.callbacks =' not in allocation
          assert 'DMA_BUF_IOCTL_SYNC' not in helper
          print('PASS: production embeds exact tested helper, unnegotiated gate precedes backing acquisition; default fd guard retained')
          PY_CHECK

      - name: Run fail-closed host pointer and physical coherent contract tests (no GPU)
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ivulkan-headers/include -Ici/scripts \
            ci/scripts/test_host_memory_contract.cpp -o "$RUNNER_TEMP/test-host-memory-contract"
          "$RUNNER_TEMP/test-host-memory-contract" | tee out/host-memory-contract-tests.txt
          python3 -I ci/scripts/test_host_memory_integration.py source | tee -a out/host-memory-contract-tests.txt

      - name: Run production native allocation lifetime tests and source invariants (no GPU)
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          c++ -std=c++17 -pthread -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ivulkan-headers/include -Ici/scripts \
            ci/scripts/test_native_backing_lease.cpp -o "$RUNNER_TEMP/test-native-backing"
          "$RUNNER_TEMP/test-native-backing" | tee out/native-backing-tests.txt
          c++ -std=c++17 -pthread -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ivulkan-headers/include -Ici/scripts \
            ci/scripts/test_native_backing_negotiation.cpp -o "$RUNNER_TEMP/test-native-negotiation"
          "$RUNNER_TEMP/test-native-negotiation" | tee -a out/native-backing-tests.txt
          c++ -std=c++17 -pthread -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ivulkan-headers/include -isystem source/common/base/include -Isource/host/common/include \
            -Isource/host/vulkan -Isource/host/include \
            ci/scripts/test_native_backing_manager.cpp source/host/common/external_object_manager.cpp \
            -o "$RUNNER_TEMP/test-native-manager"
          "$RUNNER_TEMP/test-native-manager" | tee -a out/native-backing-tests.txt
          python3 -I ci/scripts/test_native_backing_integration.py source | tee -a out/native-backing-tests.txt

      - name: Test metadata trace gate and concurrent bounds (no GPU)
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -pthread -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Ici/scripts \
            ci/scripts/test_native_roundtrip_trace.cpp -o "$RUNNER_TEMP/test-native-roundtrip-trace"
          "$RUNNER_TEMP/test-native-roundtrip-trace"
          python3 -I ci/scripts/test_native_roundtrip_integration.py "$RUNNER_TEMP/native-roundtrip-before" source | tee out/native-roundtrip-trace-tests.txt

      - name: Test one-shot CPU crossview diagnostic on CPU arrays only
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -pthread -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Ici/scripts \
            ci/scripts/test_native_cpu_crossview.cpp -o "$RUNNER_TEMP/test-native-cpu-crossview"
          "$RUNNER_TEMP/test-native-cpu-crossview"
          c++ -std=c++17 -pthread -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Ici/scripts \
            ci/scripts/test_native_cpu_reverse.cpp -o "$RUNNER_TEMP/test-native-cpu-reverse"
          "$RUNNER_TEMP/test-native-cpu-reverse"
          python3 -I ci/scripts/test_native_cpu_crossview_integration.py "$RUNNER_TEMP/native-crossview-before" source | tee out/native-cpu-crossview-tests.txt

      - name: Test one-store prewrite helper on ordinary CPU arrays
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -pthread -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Ici/scripts \
            ci/scripts/test_native_cpu_prefault.cpp -o "$RUNNER_TEMP/test-native-cpu-prefault"
          "$RUNNER_TEMP/test-native-cpu-prefault"
          python3 -I ci/scripts/test_native_cpu_prefault_integration.py "$RUNNER_TEMP/native-prefault-before" source | tee out/native-cpu-prewrite-tests.txt

      - name: Test exact production image external-type snippets
        shell: bash
        run: |
          set -euo pipefail
          python3 -I ci/scripts/test_niri_image_external_types.py source "$RUNNER_TEMP/test-niri-image-types.cpp" | tee out/niri-image-external-types-tests.txt
          c++ -std=c++17 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Ivulkan-headers/include \
            "$RUNNER_TEMP/test-niri-image-types.cpp" -o "$RUNNER_TEMP/test-niri-image-types"
          "$RUNNER_TEMP/test-niri-image-types"

      - name: Apply CIB1 host export-only bridge and test paired boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -I ci/scripts/patch_classic_image_bridge.py source
          python3 -I ci/scripts/test_classic_image_bridge_integration.py source | tee out/classic-image-bridge-tests.txt
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ivulkan-headers/include -Ici/scripts ci/scripts/test_classic_image_bridge.cpp -o "$RUNNER_TEMP/test-classic-image-bridge"
          "$RUNNER_TEMP/test-classic-image-bridge"
          python3 -I ci/scripts/patch_niri_cib_diagnostics.py source
          python3 -I ci/scripts/test_niri_cib_diagnostics.py source | tee out/niri-cib-diagnostics-tests.txt
          git -C source diff --check
          git -C source diff --binary -- . ':!third_party/vulkan_headers' > out/gfxstream-android-mali.patch
          cp ci/scripts/*classic_image_bridge* out/
          cp ci/scripts/*niri_cib_diagnostics* out/

      - name: Fetch Android NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/droidvm-ndk-download" "$RUNNER_TEMP/droidvm-ndk-extract"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/droidvm-ndk-download/ndk.zip" \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          printf '%s  %s\n' '090e8083a715fdb1a3e402d0763c388abb03fb4e' "$RUNNER_TEMP/droidvm-ndk-download/ndk.zip" | sha1sum -c -
          sha256sum "$RUNNER_TEMP/droidvm-ndk-download/ndk.zip" | cut -d ' ' -f 1 > out/ndk-archive.sha256
          unzip -q "$RUNNER_TEMP/droidvm-ndk-download/ndk.zip" -d "$RUNNER_TEMP/droidvm-ndk-extract"
          printf 'ANDROID_NDK_HOME=%s/droidvm-ndk-extract/android-ndk-r27c\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Configure Android 33 arm64 Release
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^Pkg.Revision = 27.2.12479018$' "$ANDROID_NDK_HOME/source.properties"
          cmake -S source -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-33 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_STANDALONE=ON

      - name: Build gfxstream_backend
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-android --target gfxstream_backend -j"$(nproc)"

      - name: Package binary, exact provenance, and checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t libraries < <(find build-android -type f -name libgfxstream_backend.so)
          test "${#libraries[@]}" -eq 1
          cp "${libraries[0]}" out/libgfxstream_backend.so
          cp "$ANDROID_NDK_HOME/source.properties" out/ndk-source.properties
          cp build-android/CMakeCache.txt out/
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --file-header --dynamic out/libgfxstream_backend.so > out/elf-info.txt
          grep -Eq 'Machine:.*AArch64' out/elf-info.txt
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          provenance = {
              "ci_repository": os.environ["GITHUB_REPOSITORY"],
              "ci_commit": os.environ["GITHUB_SHA"],
              "ci_checkout_commit": git("-C", "ci", "rev-parse", "HEAD"),
              "ci_branch": os.environ["GITHUB_REF_NAME"],
              "ci_run_url": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "ci_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_repository": "collegeming/gfxstream-1",
              "source_commit": git("-C", "source", "rev-parse", "HEAD"),
              "vulkan_headers_repository": "KhronosGroup/Vulkan-Headers",
              "vulkan_headers_version": "1.4.358",
              "vulkan_headers_tag_object": os.environ["VULKAN_HEADERS_TAG_OBJECT"],
              "vulkan_headers_commit": git("-C", "vulkan-headers", "rev-parse", "HEAD"),
              "vulkan_headers_replaced_path": "third_party/vulkan_headers",
              "ndk": "r27c (27.2.12479018)",
              "ndk_archive_sha256": Path("out/ndk-archive.sha256").read_text().strip(),
              "android_api": 33,
              "abi": "arm64-v8a",
              "build_type": "Release",
              "target": "gfxstream_backend",
              "semantic_patches": [
                  "Do not advertise hasSetMetadataCommand (set to 0)",
                  "When AHB/image memory type intersection is zero, use ahbProps.memoryTypeBits",
                  "Default renderer Android external memory mode to AndroidAHB; preserve explicit overrides",
                  "Append GFXSTREAM_RENDERER_FEATURES after launcher renderer features",
                  "Select existing Linux udmabuf creator on Android/Linux instead of stub",
                  "Create sealable memfds and apply SHRINK|GROW seals only to shared-memory backing",
                  "Log RingBlob and Android fillExportHandle type/handle/errno without changing AHB export semantics",
                  "Alias importer selects AHB/DMA_BUF/OPAQUE_FD by actual stream type, rejects SHM, and cleans up failed fd imports",
                  "Force dedicated image allocations for AndroidAHB ColorBuffer backing and AHB alias images",
                  "Log image transform external types, decoder allocation provenance, and image/memory state before driver bind calls",
                  "Reject zero-size non-AHB allocations before driver calls and zero-size non-AHB memory binds to AHB images in both bind entry points",
                  "Validate actual host-visible DMA_BUF fd memoryTypeBits; reject incompatible index without changing coherency; close rejected fd and release pool reservation",
                  "Enable supported KHR_external_memory_fd alongside DMA_BUF on decoder and internal devices; bounded device/dispatch and successful-query diagnostics",
                  "Default-disabled staging contract readiness gate rejects opt-in emulated guest-coherent allocations until paired backend/guest negotiation exists; no memory flag rewrite",
                  "Shared bounded identity/range/epoch state machine embedded in production; transfer callbacks exercised only by CPU mocks",
                  "Validate exact final-chain host pointer once before driver allocation in decoder and internal aliases; reject null/function/query/type/index/mask mismatch without fallback or borrowed-pointer free",
                  "Unconditional guest HOST_COHERENT to physical noncoherent rejection before backing acquisition, including alias and transformed indices; native coherent and noncoherent remain permitted",
                  "Bounded CIB1 activation diagnostics only: capset/readiness/query/create metadata, 8 records per site, no driver calls, stores, extra queries or return-value changes"
              ],
              "runtime_feature_override_example": "GFXSTREAM_RENDERER_FEATURES=VulkanAllocateHostVisibleAsUdmabuf:enabled,ExternalBlob:enabled",
              "generated_wire_code": "Unchanged from pinned gfxstream source; Vulkan-Headers replacement does not regenerate cereal wire codecs",
              "source_patch": "gfxstream-android-mali.patch (excludes separately pinned Vulkan-Headers replacement)",
              "host_memory_contract": {
                  "coherent_downgrade": "unconditional reject before backing acquisition; no environment bypass",
                  "physical_flags": "queried separately from shadow routing flags; never rewritten",
                  "pointer_type": "HOST_ALLOCATION_BIT_EXT only; foreign mapped type not intentionally supported",
                  "pointer_query": "exact final import chain, requested host index unchanged; failed query is never accepted",
                  "ownership": "helper borrows pointer only; private/shared backing RAII retained; local owned fd/pool cleaned on defensive mixed-chain rejection",
                  "native_coherent": "permitted subject to exact import compatibility; masks do not generalize across exporters",
                  "sha256": {name: hashlib.sha256(Path('out', name).read_bytes()).hexdigest()
                             for name in ['host_memory_contract.h', 'test_host_memory_contract.cpp',
                                          'test_host_memory_integration.py', 'host-memory-contract-tests.txt']}
              },
              "native_backing_lease": {
                  "production_ready": False,
                  "publication_enabled": "Only after exact version1 64-byte DVML init descriptor0x0f acknowledgement, current owner epoch, and native backing checks",
                  "pairing": "No environment bypass; old VMM absent descriptor and old host zero acknowledgement fail closed; matching VMM must prove unregister/reset/shutdown/error retention",
                  "scope": "Native host-visible nonexternal VirtioGpuNext only; imported fd/AHB/shared/private/pool paths not converted",
                  "ownership": "MemoryInfo to HostMemInfo to resource; generation revocation; unmap retains owner for remap; allocation keeps device and parent instance; worker physical finalizers capture Vulkan entrypoints/handles by value",
                  "remaining_blockers": ["Matching crosvm contract implementation must be built and paired; host init log proves acknowledgement only, not runtime KVM/coherency", "Existing valid-app device child idle/cleanup remains synchronous outside mMutex; actual device and instance free is deferred without waiting for VMM leases", "Forced active drop quarantines forever and active reset/restore reject; native snapshots rejected; reclaimer drains after decoder stop; Vulkan module/driver lock verified process-lifetime", "Runtime guest PFN, cache attributes and GPU coherency validation"],
                  "sha256": {name: hashlib.sha256(Path('out', name).read_bytes()).hexdigest()
